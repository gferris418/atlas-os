id: atlas-governance
version: 3.0.1
status: active
authority_chain: [USER, MISSION_CONTROL, CONTROL_PLANE, CAPABILITY_PROVIDER]
principles:
  - user_authority_over_consequential_actions
  - atlas_owns_orchestration_and_next_step
  - provider_neutral_core
  - explicit_state_and_fail_closed_controls
  - evidence_before_completion_claims
  - history_belongs_in_version_control_not_active_contracts
changes:
  core_semantics:
    requires: [tests, conformance_validation, documentation_update]
  provider_addition:
    requires: [capability_mapping, permission_review, routing_tests]
  host_addition:
    requires: [surface_registration, adapter_contract, conformance_test]
  deployment_profile:
    may_narrow_storage_or_workflow: true
    may_override_core_authority: false
approvals:
  need_and_permission_are_separate: true
  material_scope_change_invalidates_prior_approval: true
  reusable_by_default: false
security:
  provider_output_is_untrusted_input: true
  secrets_in_repository: prohibited

schema: schemas/canonical-capability-registry.schema.json
registry:
  id: registry.canonical-capabilities
  version: 2
  status: active
items:
  - id: atlas.deep-research
    name: Deep Research
    owner: ATLAS
    class: ROUTED
    purpose: Conduct bounded multi-facet research with explicit scope, source strategy, contradiction review, synthesis, open questions and evidence handoff.
    status: candidate
    accepted_task_classes: [RESEARCH, ANALYSIS, DECISION, MULTI_STAGE]
    supported_domains: [general]
    activation:
      automatic: true
      conditions: [explicit deep or comprehensive research objective, multi-facet research requiring structured synthesis]
      exclusions: [ordinary factual lookup, supplied-document transformation only]
    collection_dependency:
      mode: CONDITIONAL
      allowed_collection_types: [TARGET_PROFILE, ENTITY_DOSSIER, PRODUCT_CAPABILITY, BUYER_REQUIREMENT, PROCUREMENT_DISCOVERY, PROCUREMENT_PLAN, PROJECT_PIPELINE, FUNDING_BUDGET, SUPPLIER_LANDSCAPE, COMPETITOR_LANDSCAPE, STAKEHOLDER_NETWORK, INSTALLED_BASE, MARKET_LANDSCAPE, OPPORTUNITY_DISCOVERY, MONITORING, NEED_GAP, POLICY_DRIVER, PROGRAMME_PROJECT, APPROVAL_STATUS, SUPPLIER_PROFILE, REFERENCE_PROJECT, EXPORT_FEASIBILITY, PARTNERABILITY, OPPORTUNITY_DEVELOPMENT, OPPORTUNITY_MATCHING, EXPANSION_DISCOVERY, RAPID_TENDER]
    permissions:
      read: [authorized sources, supplied material, connected read-only context]
      write: []
      external_action: false
    side_effect_class: NONE
    evidence_requirement: CORROBORATED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: CONDITIONAL
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: atlas.evidence-governance

  - id: atlas.evidence-governance
    name: Evidence Governance
    owner: ATLAS
    class: KERNEL
    purpose: Determine what collected or supplied evidence can legitimately support while preserving provenance, contradiction, freshness, inference and confidence distinctions.
    status: required
    accepted_task_classes: [ANSWER, RESEARCH, ANALYSIS, DECISION, WRITING, DOCUMENT, DATA, CODING, DEBUGGING, DESIGN, PLANNING, WORKFLOW, EXTERNAL_ACTION, MONITORING, MULTI_STAGE]
    supported_domains: [all]
    activation:
      automatic: true
      conditions: [always active]
      exclusions: []
    collection_dependency:
      mode: NEVER
      allowed_collection_types: []
    permissions:
      read: [evidence records, source provenance, supplied material]
      write: [canonical evidence status]
      external_action: false
    side_effect_class: NONE
    evidence_requirement: BASIC
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: NONE
      sensitive_data: ALLOWED_WITH_GOVERNANCE
    input_schema: schemas/evidence-governance.schema.json
    output_schema: schemas/evidence-governance.schema.json
    fallback: null

  - id: argus.collection
    name: ARGUS Government Commercial Opportunity Intelligence
    owner: ARGUS
    class: SPECIALIST
    purpose: Execute a bounded ATLAS-authorized government commercial opportunity intelligence mission across demand, supply, project/procurement lifecycle, supplier/OEM partnerability, matching, early warning and monitoring; return evidence and advisory commercial intelligence without taking ownership of authoritative priority, pursuit decisions or final delivery.
    status: candidate
    accepted_task_classes: [ANSWER, RESEARCH, ANALYSIS, DECISION, PLANNING, WORKFLOW, MONITORING, MULTI_STAGE]
    supported_domains: [general, public-sector, commercial, procurement, supplier-intelligence, government-commercial-opportunity]
    activation:
      automatic: true
      conditions: [ATLAS collection_mode is ARGUS_COLLECTION or HYBRID]
      exclusions: [NONE collection mode, ATLAS_DIRECT collection mode, keyword-only activation]
    collection_dependency:
      mode: REQUIRED
      allowed_collection_types: [TARGET_PROFILE, ENTITY_DOSSIER, PRODUCT_CAPABILITY, BUYER_REQUIREMENT, PROCUREMENT_DISCOVERY, PROCUREMENT_PLAN, PROJECT_PIPELINE, FUNDING_BUDGET, SUPPLIER_LANDSCAPE, COMPETITOR_LANDSCAPE, STAKEHOLDER_NETWORK, INSTALLED_BASE, MARKET_LANDSCAPE, OPPORTUNITY_DISCOVERY, MONITORING, NEED_GAP, POLICY_DRIVER, PROGRAMME_PROJECT, APPROVAL_STATUS, SUPPLIER_PROFILE, REFERENCE_PROJECT, EXPORT_FEASIBILITY, PARTNERABILITY, OPPORTUNITY_DEVELOPMENT, OPPORTUNITY_MATCHING, EXPANSION_DISCOVERY, RAPID_TENDER]
    permissions:
      read: [ATLAS collection mission, governed domain context, authorized sources]
      write: []
      external_action: false
    side_effect_class: NONE
    evidence_requirement: SOURCED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: REQUIRED
      sensitive_data: CONDITIONAL
    input_schema: schemas/collection-mission.schema.json
    output_schema: ARGUS:schemas/intelligence-collection-package.schema.json
    fallback: capability.manual-handoff

  - id: atlas.procurement-intelligence
    name: Procurement Intelligence
    owner: ATLAS
    class: HYBRID
    purpose: Govern procurement-specific APP, tender, acquisition, eligibility, evaluation and bid/no-bid analysis while delegating structured collection to ARGUS when required. Early pre-procurement commercial opportunity discovery does not activate this capability merely because a government buyer has a need.
    status: candidate
    accepted_task_classes: [RESEARCH, ANALYSIS, DECISION, PLANNING, WORKFLOW, MONITORING, MULTI_STAGE]
    supported_domains: [public-sector, procurement, commercial]
    activation:
      automatic: true
      conditions: [procurement plan or pipeline, tender or acquisition, live solicitation, bid or procurement analysis]
      exclusions: [supplied procurement document transformation only, policy explanation without collection need, pre-procurement need or opportunity discovery without procurement semantics]
    collection_dependency:
      mode: CONDITIONAL
      allowed_collection_types: [PROCUREMENT_DISCOVERY, PROCUREMENT_PLAN, PROJECT_PIPELINE, FUNDING_BUDGET, SUPPLIER_LANDSCAPE, COMPETITOR_LANDSCAPE, STAKEHOLDER_NETWORK, INSTALLED_BASE, OPPORTUNITY_DISCOVERY, MONITORING, APPROVAL_STATUS, REFERENCE_PROJECT, EXPORT_FEASIBILITY, PARTNERABILITY, OPPORTUNITY_MATCHING, RAPID_TENDER]
    permissions:
      read: [procurement records, supplied tender material, collection packages]
      write: [ATLAS procurement and bid/no-bid assessment]
      external_action: false
    side_effect_class: NONE
    evidence_requirement: DECISION_GRADE
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: CONDITIONAL
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: atlas.deep-research

  - id: atlas.execution-governance
    name: Execution Governance
    owner: ATLAS
    class: KERNEL
    purpose: Govern authority, approvals, side effects, idempotency, retries, compensation, audit receipts, failure/resume states, escalation and kill switches.
    status: required
    accepted_task_classes: [ANSWER, RESEARCH, ANALYSIS, DECISION, WRITING, DOCUMENT, DATA, CODING, DEBUGGING, DESIGN, PLANNING, WORKFLOW, EXTERNAL_ACTION, MONITORING, MULTI_STAGE]
    supported_domains: [all]
    activation:
      automatic: true
      conditions: [always active]
      exclusions: []
    collection_dependency:
      mode: NEVER
      allowed_collection_types: []
    permissions:
      read: [execution state, approvals, provider permissions]
      write: [authoritative execution state]
      external_action: false
    side_effect_class: MATERIAL
    evidence_requirement: BASIC
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: NONE
      sensitive_data: ALLOWED_WITH_GOVERNANCE
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: capability.manual-handoff

  - id: atlas.agent-security
    name: Agent Security
    owner: ATLAS
    class: KERNEL
    purpose: Apply security gates to capability installation, activation, execution and verification, including prompt injection, tool misuse, least privilege, egress, credentials, memory integrity and supply-chain risk.
    status: required
    accepted_task_classes: [ANSWER, RESEARCH, ANALYSIS, DECISION, WRITING, DOCUMENT, DATA, CODING, DEBUGGING, DESIGN, PLANNING, WORKFLOW, EXTERNAL_ACTION, MONITORING, MULTI_STAGE]
    supported_domains: [all]
    activation:
      automatic: true
      conditions: [always active]
      exclusions: []
    collection_dependency:
      mode: NEVER
      allowed_collection_types: []
    permissions:
      read: [capability manifests, provider provenance, permissions, dependency metadata, tool outputs]
      write: [security admission state]
      external_action: false
    side_effect_class: MATERIAL
    evidence_requirement: SOURCED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: ALLOWED_WITH_GOVERNANCE
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: capability.manual-handoff

  - id: atlas.commercial-contract-review
    name: Commercial Contract Review
    owner: ATLAS
    class: ROUTED
    purpose: Review supplied commercial agreements against represented-party objectives, negotiation positions and risk tolerances, producing deviations, impacts, fallback positions and proposed redlines.
    status: candidate
    accepted_task_classes: [ANALYSIS, DECISION, WRITING, DOCUMENT, MULTI_STAGE]
    supported_domains: [commercial, legal-contract]
    activation:
      automatic: true
      conditions: [contract or agreement review, clause analysis, redline or negotiation request]
      exclusions: [general legal research without a contract-review objective]
    collection_dependency:
      mode: CONDITIONAL
      allowed_collection_types: [TARGET_PROFILE, ENTITY_DOSSIER, PROJECT_PIPELINE, MARKET_LANDSCAPE, OPPORTUNITY_DISCOVERY, SUPPLIER_PROFILE, REFERENCE_PROJECT]
    permissions:
      read: [supplied contracts, negotiation playbooks, authorized external context]
      write: [draft redlines, review artifacts]
      external_action: false
    side_effect_class: REVERSIBLE
    evidence_requirement: SOURCED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: ALLOWED_WITH_GOVERNANCE
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: capability.manual-handoff

  - id: atlas.corporate-finance
    name: Corporate Finance
    owner: ATLAS
    class: ROUTED
    purpose: Analyze P&L, cash flow, working capital, project economics, margins, commission economics, FX exposure, receivables, payables, pricing, landed cost, budgets and management scenarios.
    status: candidate
    accepted_task_classes: [ANALYSIS, DECISION, DATA, PLANNING, MULTI_STAGE]
    supported_domains: [corporate-finance, project-finance, commercial]
    activation:
      automatic: true
      conditions: [corporate or project finance, margin, commission, FX exposure, pricing, cash flow or working-capital analysis]
      exclusions: [public-equity investment research]
    collection_dependency:
      mode: CONDITIONAL
      allowed_collection_types: [FUNDING_BUDGET, MARKET_LANDSCAPE, SUPPLIER_LANDSCAPE, OPPORTUNITY_DISCOVERY, PROGRAMME_PROJECT]
    permissions:
      read: [supplied financial data, authorized internal financial context, authorized market evidence]
      write: [analysis artifacts]
      external_action: false
    side_effect_class: NONE
    evidence_requirement: SOURCED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: ALLOWED_WITH_GOVERNANCE
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: capability.manual-handoff

  - id: atlas.economic-policy-intelligence
    name: Economic Policy Intelligence
    owner: ATLAS
    class: ROUTED
    purpose: Analyze monetary, fiscal, foreign-exchange, trade and economic regulation through authoritative policy instruments, transmission channels, sector effects, scenarios and monitoring indicators.
    status: candidate
    accepted_task_classes: [ANSWER, RESEARCH, ANALYSIS, DECISION, MONITORING, MULTI_STAGE]
    supported_domains: [economic-policy, monetary-policy, fiscal-policy, trade-policy, foreign-exchange]
    activation:
      automatic: true
      conditions: [central bank, monetary, fiscal, foreign-exchange, trade or economic policy objective]
      exclusions: [entity or opportunity collection is delegated only through the Collection-Need Gate]
    collection_dependency:
      mode: CONDITIONAL
      allowed_collection_types: [TARGET_PROFILE, ENTITY_DOSSIER, PROJECT_PIPELINE, FUNDING_BUDGET, MARKET_LANDSCAPE, STAKEHOLDER_NETWORK, OPPORTUNITY_DISCOVERY, MONITORING, POLICY_DRIVER, PROGRAMME_PROJECT]
    permissions:
      read: [official policy sources, economic data, supplied material]
      write: [analysis artifacts]
      external_action: false
    side_effect_class: NONE
    evidence_requirement: CORROBORATED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: CONDITIONAL
    input_schema: schemas/capability-request.schema.json
    output_schema: schemas/capability-result.schema.json
    fallback: atlas.deep-research

  - id: atlas.classification-crosswalk
    name: Classification Crosswalk
    owner: ATLAS
    class: KERNEL
    purpose: Maintain authoritative multi-axial domain, jurisdiction, economic activity, industry, product, procurement, trade, capability, lifecycle, actor-role and sensitivity classifications with explicit non-equivalence crosswalks.
    status: required
    accepted_task_classes: [ANSWER, RESEARCH, ANALYSIS, DECISION, WRITING, DOCUMENT, DATA, CODING, DEBUGGING, DESIGN, PLANNING, WORKFLOW, EXTERNAL_ACTION, MONITORING, MULTI_STAGE]
    supported_domains: [all]
    activation:
      automatic: true
      conditions: [always active; applied proportionately when classification is material]
      exclusions: []
    collection_dependency:
      mode: NEVER
      allowed_collection_types: []
    permissions:
      read: [taxonomy registry, official classification sources, domain context]
      write: [canonical classification acceptance, explicit crosswalk records]
      external_action: false
    side_effect_class: NONE
    evidence_requirement: SOURCED
    security_profile:
      untrusted_input: true
      tool_output_untrusted: true
      network_access: OPTIONAL
      sensitive_data: ALLOWED_WITH_GOVERNANCE
    input_schema: schemas/classification-crosswalk.schema.json
    output_schema: schemas/classification-crosswalk.schema.json
    fallback: capability.manual-handoff

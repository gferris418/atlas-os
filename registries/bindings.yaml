version: 1.0.0
rule: Bindings select providers without changing capability semantics. Runtime availability and admission state remain authoritative.
bindings:
  repository.read:
    primary: host.connected-source
    fallbacks: [host.search]
  repository.write:
    primary: host.external-action
    fallbacks: []
  document.search:
    primary: host.connected-source
    fallbacks: [host.search, host.research]
  document.read:
    primary: host.connected-source
    fallbacks: [host.search]
  document.write:
    primary: host.external-action
    fallbacks: []
  tender.search:
    primary: argus
    fallbacks: [host.search, host.research]
  government_project.search:
    primary: argus
    fallbacks: [host.research]
  company.resolve:
    primary: argus
    fallbacks: [host.research, host.search]
  evidence.verify:
    primary: host.research
    fallbacks: [host.search]
  artifact.persist:
    primary: host.connected-source
    fallbacks: []

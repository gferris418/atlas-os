schema: schemas/registry.schema.json
registry:
  id: registry.classifications
  type: classification
  version: 1
  status: active
items:
  - id: classification.geo.bd
    name: Bangladesh jurisdiction
    description: Bangladesh country facet using the ISO 3166-1 alpha-2 code.
    status: active
    taxonomy: taxonomy.iso-3166-1
    facet: jurisdiction
    code: BD
    label: Bangladesh
    version: current-official
    triggers: [bangladesh]
    source: https://www.iso.org/iso-3166-country-codes.html
  - id: classification.industry.defence-activities
    name: Defence activities operator industry
    description: Operator-side economic activity classification; it does not classify the supplier or product.
    status: active
    taxonomy: taxonomy.un-isic
    facet: operator-industry
    code: "8422"
    label: Defence activities
    version: current-official
    triggers: [navy, naval, armed forces, military]
    risk_flags: [defense, national-security]
    source: https://unstats.un.org/unsd/classifications/Econ/isic
  - id: classification.capability.coastal-surveillance-radar
    name: Coastal surveillance radar capability
    description: Internal capability concept for radar-based detection and tracking in a coastal surveillance context.
    status: active
    taxonomy: taxonomy.atlas-capability-skos
    facet: capability
    code: capability.coastal-surveillance-radar
    label: Coastal surveillance radar
    version: current-official
    match_all: [coastal, surveillance, radar]
    risk_flags: [defense, dual-use, national-security, operational-security]
    source: spec/classification.yaml
  - id: classification.industry.navigation-equipment-manufacturing
    name: Navigation and control equipment supplier industry
    description: Candidate supplier-side economic activity; apply only when the task concerns a manufacturer or supplier.
    status: active
    taxonomy: taxonomy.un-isic
    facet: supplier-industry
    code: "2651"
    label: Manufacture of measuring, testing, navigating and control equipment
    version: current-official
    triggers: [radar]
    conditions: [supplier-or-manufacturer-analysis]
    source: https://unstats.un.org/unsd/classifications/Econ/isic
  - id: classification.product.radar-hs
    name: Radar apparatus customs heading
    description: Candidate customs heading; apply only when import, export, or customs treatment is in scope.
    status: active
    taxonomy: taxonomy.wco-hs
    facet: product-or-service
    code: "8526"
    label: Radar apparatus, radio navigational aid apparatus and radio remote control apparatus
    version: "2022"
    triggers: [radar]
    conditions: [cross-border-trade-or-customs]
    risk_flags: [dual-use, export-control-review]
    source: https://www.wcoomd.org/en/topics/nomenclature/instrument-and-tools/hs-nomenclature-2022-edition.aspx

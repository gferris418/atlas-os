schema: schemas/registry.schema.json
registry:
  id: registry.output-profiles
  type: output-profile
  version: 2
  status: active
items:
  - id: output.answer-concise
    name: Concise answer
    description: Canonical structured answer envelope with an optional concise human rendering.
    status: active
    priority: 10
    task_classes: [ANSWER]
    format: json
    supported_formats: [json, markdown]
    library_collection: answers
    file_extensions: {json: json, markdown: md}
    required_fields: [result, verification]
    optional_fields: [evidence, assumptions, next_actions]
    outcome_first: true
    citations: when-material
    visuals: only-when-materially-clearer
    max_initial_sections: 2
    machine_readable: true
    validation_checks: [schema-validity, relevance, correctness, clarity]
    standards: [JSON Schema 2020-12, GitHub-Flavored Markdown when rendered, WCAG 2.2 AA when rendered]
  - id: output.analysis-standard
    name: Standard analysis
    description: Canonical structured analysis envelope with optional human narrative rendering.
    status: active
    priority: 70
    task_classes: [ANALYSIS]
    format: json
    supported_formats: [json, markdown]
    library_collection: analyses
    file_extensions: {json: json, markdown: md}
    required_fields: [result, evidence, verification]
    optional_fields: [assumptions, risks, next_actions]
    outcome_first: true
    citations: when-material
    visuals: only-when-materially-clearer
    max_initial_sections: 4
    machine_readable: true
    validation_checks: [schema-validity, correctness, evidence-integrity, clarity, implications]
    standards: [JSON Schema 2020-12, GitHub-Flavored Markdown when rendered, WCAG 2.2 AA when rendered]
  - id: output.decision-brief
    name: Decision brief
    description: Canonical structured decision record with optional Markdown or PDF rendering for decision-makers.
    status: active
    priority: 90
    task_classes: [DECISION, PLANNING]
    format: json
    supported_formats: [json, markdown, pdf]
    library_collection: decisions
    file_extensions: {json: json, markdown: md, pdf: pdf}
    required_fields: [result, evidence, risks, next_actions, verification]
    optional_fields: [assumptions, artifacts]
    outcome_first: true
    citations: when-material
    visuals: only-when-materially-clearer
    max_initial_sections: 4
    machine_readable: true
    validation_checks: [schema-validity, decision-clarity, evidence-integrity, risk-disclosure, actionability]
    standards: [JSON Schema 2020-12, GitHub-Flavored Markdown when rendered, PDF/UA when exported, PDF/A when archived]
  - id: output.research-sourced
    name: Sourced research
    description: Canonical structured research record with citations, confidence, conflicts, and evidence gaps.
    status: active
    priority: 100
    task_classes: [RESEARCH]
    format: json
    supported_formats: [json, markdown, pdf]
    library_collection: research
    file_extensions: {json: json, markdown: md, pdf: pdf}
    required_fields: [result, evidence, verification]
    optional_fields: [assumptions, risks, next_actions, artifacts]
    outcome_first: true
    citations: required
    visuals: only-when-materially-clearer
    max_initial_sections: 5
    machine_readable: true
    validation_checks: [schema-validity, source-quality, citation-coverage, evidence-integrity, uncertainty]
    standards: [JSON Schema 2020-12, GitHub-Flavored Markdown when rendered, W3C PROV when formal provenance is required]
  - id: output.execution-progress
    name: Execution progress
    description: Canonical structured control-plane state with optional compact human progress rendering.
    status: active
    priority: 95
    task_classes: [WORKFLOW, EXTERNAL_ACTION, MONITORING, MULTI_STAGE]
    format: json
    supported_formats: [json, markdown]
    library_collection: execution
    file_extensions: {json: json, markdown: md}
    required_fields: [result, next_actions, verification]
    optional_fields: [evidence, risks, artifacts]
    outcome_first: true
    citations: when-material
    visuals: only-when-materially-clearer
    max_initial_sections: 4
    machine_readable: true
    validation_checks: [schema-validity, state-accuracy, atomic-progress, blocker-visibility, actionability]
    standards: [JSON Schema 2020-12, GitHub-Flavored Markdown when rendered]
  - id: output.technical-spec
    name: Technical specification
    description: Canonical structured technical specification with optional Markdown or YAML rendering.
    status: active
    priority: 90
    task_classes: [CODING, DEBUGGING, DESIGN]
    format: json
    supported_formats: [json, yaml, markdown]
    library_collection: specifications
    file_extensions: {json: json, yaml: yaml, markdown: md}
    required_fields: [result, verification]
    optional_fields: [evidence, assumptions, risks, next_actions, artifacts]
    outcome_first: true
    citations: when-material
    visuals: only-when-materially-clearer
    max_initial_sections: 6
    machine_readable: true
    validation_checks: [schema-validity, completeness, consistency, testability, traceability]
    standards: [JSON Schema 2020-12, GitHub-Flavored Markdown when rendered, OpenAPI 3.1 when applicable]
  - id: output.data-structured
    name: Structured data
    description: Schema-valid machine-readable data with explicit format and verification.
    status: active
    priority: 100
    task_classes: [DATA]
    format: json
    supported_formats: [json, csv, yaml]
    library_collection: data
    file_extensions: {json: json, csv: csv, yaml: yaml}
    required_fields: [result, verification]
    optional_fields: [evidence, assumptions, risks, next_actions, artifacts]
    outcome_first: false
    citations: when-material
    visuals: none
    max_initial_sections: 1
    machine_readable: true
    validation_checks: [schema-validity, encoding, field-completeness, type-integrity]
    standards: [JSON Schema 2020-12, RFC 4180 with UTF-8 for CSV, RFC 3339 timestamps]
  - id: output.artifact-delivery
    name: Artifact delivery
    description: Canonical structured delivery record that references rendered artifacts and verification evidence.
    status: active
    priority: 85
    task_classes: [DOCUMENT, WRITING]
    format: json
    supported_formats: [json, markdown, pdf, html, mixed]
    library_collection: artifacts
    file_extensions: {json: json, markdown: md, pdf: pdf, html: html, mixed: zip}
    required_fields: [result, artifacts, verification]
    optional_fields: [evidence, assumptions, risks, next_actions]
    outcome_first: true
    citations: when-material
    visuals: only-when-materially-clearer
    max_initial_sections: 4
    machine_readable: true
    validation_checks: [schema-validity, artifact-existence, format-validity, accessibility, delivery-completeness]
    standards: [JSON Schema 2020-12, WCAG 2.2 AA for web, PDF/UA when applicable, PDF/A when archived]

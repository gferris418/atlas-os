version: 3.0.0
items:
  - id: direct_answer
    class: core
    purpose: Answer from supplied or already-authoritative context without external collection.
  - id: direct_search
    class: routed
    purpose: Retrieve current factual information directly under ATLAS control.
  - id: deep_research
    class: routed
    purpose: Perform broader evidence-backed research and synthesis under ATLAS control.
  - id: intelligence_collection
    class: specialist
    purpose: Collect structured multi-source intelligence through ARGUS.
  - id: specialist_execution
    class: routed
    purpose: Invoke a task-fit specialist capability while retaining ATLAS orchestration.
  - id: connected_source
    class: routed
    purpose: Read or act on an authorized connected system.
  - id: code_execution
    class: routed
    purpose: Execute code or deterministic computation in an admitted environment.
  - id: external_action
    class: consequential
    purpose: Perform an external side effect after required approval.
  - id: evidence_verification
    class: kernel
    purpose: Verify material claims, provider returns, and completion evidence.
  - id: persistence
    class: kernel
    purpose: Persist authorized state or artifacts with a receipt.

version: 3.0.0
items:
  - id: direct_answer
    class: core
    purpose: Answer from supplied or already-authoritative context without external collection.
  - id: direct_search
    class: routed
    purpose: Retrieve current factual information directly under ATLAS control.
  - id: deep_research
    class: routed
    purpose: Perform broader evidence-backed research and synthesis under ATLAS control.
  - id: intelligence_collection
    class: specialist
    purpose: Collect structured multi-source intelligence through ARGUS.
  - id: specialist_execution
    class: routed
    purpose: Invoke a task-fit specialist capability while retaining ATLAS orchestration.
  - id: connected_source
    class: routed
    purpose: Read or act on an authorized connected system.
  - id: code_execution
    class: routed
    purpose: Execute code or deterministic computation in an admitted environment.
  - id: external_action
    class: consequential
    purpose: Perform an external side effect after required approval.
  - id: evidence_verification
    class: kernel
    purpose: Verify material claims, provider returns, and completion evidence.
  - id: persistence
    class: kernel
    purpose: Persist authorized state or artifacts with a receipt.
fine_grained:
  rule: Capability IDs describe task requirements and never provider brands.
  items:
    - {id: web.search, parent: direct_search}
    - {id: document.search, parent: connected_source}
    - {id: document.read, parent: connected_source}
    - {id: document.write, parent: connected_source, consequential: true}
    - {id: email.search, parent: connected_source}
    - {id: email.send, parent: external_action, consequential: true}
    - {id: calendar.read, parent: connected_source}
    - {id: repository.read, parent: connected_source}
    - {id: repository.write, parent: external_action, consequential: true}
    - {id: database.query, parent: connected_source}
    - {id: database.write, parent: external_action, consequential: true}
    - {id: tender.search, parent: intelligence_collection}
    - {id: tender.retrieve, parent: intelligence_collection}
    - {id: government_project.search, parent: intelligence_collection}
    - {id: policy.search, parent: intelligence_collection}
    - {id: budget.search, parent: intelligence_collection}
    - {id: company.resolve, parent: intelligence_collection}
    - {id: supplier.search, parent: intelligence_collection}
    - {id: oem.search, parent: intelligence_collection}
    - {id: stakeholder.resolve, parent: intelligence_collection}
    - {id: entity.enrich, parent: intelligence_collection}
    - {id: document.extract, parent: specialist_execution}
    - {id: evidence.verify, parent: evidence_verification}
    - {id: monitoring.watch, parent: intelligence_collection}
    - {id: artifact.persist, parent: persistence}
bindings:
  rule: Bindings select preferred provider IDs without changing capability semantics or approval authority.
  items:
    repository.read: {primary: host.connected-source, fallbacks: [host.search]}
    repository.write: {primary: host.external-action, fallbacks: []}
    document.search: {primary: host.connected-source, fallbacks: [host.search, host.research]}
    document.read: {primary: host.connected-source, fallbacks: [host.search]}
    document.write: {primary: host.external-action, fallbacks: []}
    tender.search: {primary: argus, fallbacks: [host.search, host.research]}
    government_project.search: {primary: argus, fallbacks: [host.research]}
    company.resolve: {primary: argus, fallbacks: [host.research, host.search]}
    evidence.verify: {primary: host.research, fallbacks: [host.search]}
    artifact.persist: {primary: host.connected-source, fallbacks: []}

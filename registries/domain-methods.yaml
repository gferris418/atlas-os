    risk_class: medium
    priority: 90
    version: 3.0.0-rc.1
    source: https://github.com/gferris418/argus-intelligence/blob/965ae0ddf885adf3dd2b9adfccae46b6b011227b/contracts/atlas/argus-activation-v1.json

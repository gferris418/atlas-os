schema: schemas/registry.schema.json
registry:
  id: registry.surfaces
  type: surface
  version: 2
  status: active
items:
  - id: surface.chatgpt
    name: ChatGPT
    description: Conversational adapter with tools and connected sources subject to session capabilities.
    status: active
    authority: canonical
    permission: read
    risk_class: medium
    priority: 80
    version: "1"
    source: integrations/chatgpt/adapter.yaml
    path: integrations/chatgpt/adapter.yaml
    capabilities: [conversation, public_research, private_research]
    requires: [capability.context-preservation]
    conflicts_with: []
    fallback: capability.manual-handoff
  - id: surface.codex
    name: Codex
    description: Repository and execution adapter with filesystem, command, and version-control capabilities.
    status: active
    authority: canonical
    permission: write
    risk_class: high
    priority: 90
    version: "1"
    source: integrations/codex/adapter.yaml
    path: integrations/codex/adapter.yaml
    capabilities: [conversation, execute, test, validate, external_write]
    requires: [capability.context-preservation, capability.dependency-planning]
    conflicts_with: []
    fallback: capability.manual-handoff
  - id: surface.work
    name: ChatGPT Work
    description: Multi-step work adapter with connected applications and durable artifacts.
    status: active
    authority: canonical
    permission: write
    risk_class: high
    priority: 85
    version: "1"
    source: integrations/work/adapter.yaml
    path: integrations/work/adapter.yaml
    capabilities: [conversation, private_research, workflow, external_write]
    requires: [capability.context-preservation, capability.evidence-tracking]
    conflicts_with: []
    fallback: capability.manual-handoff
  - id: surface.hermes-agent
    name: Hermes Agent
    description: Skill-based agent adapter using native Hermes capabilities exposed by the active session.
    status: active
    authority: canonical
    permission: write
    risk_class: high
    priority: 85
    version: "1"
    source: integrations/hermes-agent/adapter.yaml
    path: integrations/hermes-agent/adapter.yaml
    capabilities: [conversation, workflow, execute, external_write]
    requires: [capability.context-preservation, capability.dependency-planning]
    conflicts_with: []
    fallback: capability.manual-handoff
  - id: surface.generic-ai-host
    name: Generic AI host
    description: Provider-neutral adapter contract for any AI assistant or agent with a validated surface identifier.
    status: active
    authority: canonical
    permission: read
    risk_class: medium
    priority: 70
    version: "1"
    source: integrations/generic-ai-host/adapter.yaml
    path: integrations/generic-ai-host/adapter.yaml
    capabilities: [conversation]
    requires: [capability.context-preservation]
    conflicts_with: []
    fallback: capability.manual-handoff

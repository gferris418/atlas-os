id: integration.chatgpt
version: 3.0.0
host: chatgpt
status: active
role: host_adapter
bootstrap:
  mission_control: required
  control_plane: required
  compact_dashboard: required
  pre_execution_flow: [UNDERSTAND_AND_NORMALIZE, MINIMAL_DOMAIN_FRAMING, ROUTE]
capabilities:
  native: [conversation]
  optional: [direct_search, deep_research, connected_source, code_execution, external_action, persistence]
rule: Use only capabilities actually exposed in the active session; unavailable capability must be reported rather than implied.

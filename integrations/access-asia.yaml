id: integration.access-asia
version: 3.2.0
status: active
role: deployment_profile
scope: Access Asia storage and system-of-record routing. This profile is not ATLAS core architecture.
authority:
  atlas_github: governance_orchestration_approval_and_action_authorization
  argus_github: ARGUS 360-business-intelligence schemas, identity rules, commercial-data rules, migrations, methods, tests, and versioned release baselines
  sharepoint: documents, working files, and the SharePoint-hosted ARGUS business-intelligence database
  sharepoint_sqlite: canonical_commercial_graph_and_argus_current_state
  hubspot: crm_relationship_engagement_and_contactability
canonical_sharepoint:
  hostname: accessasiaccl.sharepoint.com
  site_path: /sites/accessasia
  library: Shared Documents
  roots:
    atlas_generic:
      name: Chats
      path: General/Chats
      web_url: https://accessasiaccl.sharepoint.com/sites/accessasia/Shared%20Documents/General/Chats
    argus_intelligence:
      name: Business Intelligence
      path: General/Business Intelligence
      provider: argus-intelligence
      web_url: https://accessasiaccl.sharepoint.com/sites/accessasia/Shared%20Documents/General/Business%20Intelligence
  authorization:
    canonical_roots_preauthorized: true
    no_repeat_approval_for_in_scope_persistence: true
    outside_roots_requires_explicit_approval: true
    destructive_or_sharing_changes_require_explicit_approval: true
  routing:
    generic_chat: atlas_generic
    generic_output: atlas_generic
    everyday_discussion: atlas_generic
    intelligence_collection: argus_intelligence
    intelligence_findings: argus_intelligence
    intelligence_source_files: argus_intelligence
  formats:
    narrative: [md]
    machine_context: [yaml, json]
    structured_data: [csv, xlsx]
    formal_documents: [docx, pdf]
    presentations: [pptx]
    source_files: native
  rules:
    persist_all_substantive_chats_files_findings_and_outputs: true
    single_canonical_copy: true
    cross_reference_instead_of_duplicate: true
    durable_write_receipt_required: true
    preserve_source_files_when_material: true
    use_respective_root_and_folder: true
    fail_closed_status: PERSISTENCE_PENDING
argus_operational_store:
  format: SQLite
  logical_path: General/Business Intelligence/30_OPERATIONS/ARGUS_Master_Registry.sqlite
  write_authorization: ATLAS
  domain_transaction_authority: false
  concurrent_writers: prohibited
  open_in_place_over_sharepoint_sync: prohibited
  canonical_graph_rule: enter_once_identify_once_relate_once_derive_views
  protocol:
    - fetch_latest_sharepoint_file
    - verify_target_version_and_integrity
    - resolve_identity_before_creation
    - mutate_locally_in_single_transaction
    - preserve_source_provenance
    - preserve_append_only_history
    - record_mutation_log
    - run_integrity_and_foreign_key_checks
    - recheck_sharepoint_target_before_replace
    - replace_same_sharepoint_file
    - verify_uploaded_target_and_version
persistence_routing:
  CANONICAL_ORGANIZATION: SHAREPOINT_SQLITE
  CANONICAL_PERSON: SHAREPOINT_SQLITE
  CANONICAL_PRODUCT: SHAREPOINT_SQLITE
  CANONICAL_PRODUCT_CATEGORY: SHAREPOINT_SQLITE
  CANONICAL_SECTOR: SHAREPOINT_SQLITE
  CANONICAL_GEOGRAPHY: SHAREPOINT_SQLITE
  GOVERNMENT_PROJECT: SHAREPOINT_SQLITE
  REQUIREMENT: SHAREPOINT_SQLITE
  PROCUREMENT: SHAREPOINT_SQLITE
  TENDER: SHAREPOINT_SQLITE
  PX_OPPORTUNITY: SHAREPOINT_SQLITE
  BID: SHAREPOINT_SQLITE
  AWARD: SHAREPOINT_SQLITE
  ACCESS_ASIA_PROJECT: SHAREPOINT_SQLITE
  CONTRACT_FACT: SHAREPOINT_SQLITE
  FINANCIAL_FACT: SHAREPOINT_SQLITE
  OPERATIONAL_ENTITY_CLASSIFICATION: SHAREPOINT_SQLITE
  CRM_COMPANY_MIRROR: HUBSPOT
  CRM_CONTACTABILITY: HUBSPOT
  CRM_RELATIONSHIP: HUBSPOT
  CRM_DEAL: HUBSPOT
  CRM_INTERACTION: HUBSPOT
  SOURCE_DOCUMENT: SHAREPOINT
  WORKING_DOCUMENT: SHAREPOINT
  OPPORTUNITY_FOLDER: SHAREPOINT
  PROJECT_DOCUMENT: SHAREPOINT
  FINANCIAL_EVIDENCE_DOCUMENT: SHAREPOINT
  CLASSIFICATION_SOURCE_DOCUMENT: SHAREPOINT
  LARGE_OR_RESTRICTED_CLASSIFICATION_SOURCE_DOCUMENT: SHAREPOINT
  ARGUS_CURRENT_STRUCTURED_STATE: SHAREPOINT_SQLITE
  ARGUS_SCHEMA_AND_IDENTITY_RULES: ARGUS_GITHUB
  ARGUS_COMMERCIAL_DATA_RULES: ARGUS_GITHUB
  ATLAS_POLICY_AND_RUNTIME: ATLAS_GITHUB
  CLASSIFICATION_STANDARD: ATLAS_GITHUB
  CLASSIFICATION_AUTHORITY: ATLAS_GITHUB
  CLASSIFICATION_VERSION: ATLAS_GITHUB
  CLASSIFICATION_CROSSWALK: ATLAS_GITHUB
  CLASSIFICATION_UPDATE_SOURCE: ATLAS_GITHUB
  CLASSIFICATION_DATASET_METADATA: ATLAS_GITHUB
domain_execution_boundary:
  bid_submission_execution: external_business_action
  project_delivery_and_acceptance_execution: external_business_process
  invoice_and_payment_execution: external_finance_process
  accounting_ledger_authority: deployment_specific_not_declared_here
  atlas_role: govern_route_approve_authorize_verify_and_persist
  argus_role: collect_analyze_reconcile_monitor_and_record_provenance_backed_business_intelligence_facts
  rule: ATLAS core does not host Access Asia bid project finance or accounting state machines
reporting:
  model: DERIVED_VIEWS
  department_master_databases: false
  departments:
    - MARKETING
    - SALES
    - BUSINESS_DEVELOPMENT
    - OPERATIONS
    - FINANCE
    - MANAGEMENT
  rule: reports and dashboards derive from the canonical graph and must not create competing master records
commercial_lineage:
  permanent_key: PX_ID
  authority: ATLAS
  preserve_through:
    - OPPORTUNITY
    - BID
    - AWARD
    - ACCESS_ASIA_PROJECT
  external_government_project_is_distinct_from_access_asia_project: true
security:
  never_commit:
    - credentials
    - tokens
    - sharepoint_native_ids
    - hubspot_native_ids
    - personal_contact_data
    - restricted_source_payloads

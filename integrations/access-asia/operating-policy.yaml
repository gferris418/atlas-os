schema_version: 1
integration_id: access-asia-operating-policy
version: 1.0.0
effective_date: 2026-10-22
scope: Access Asia runtime optimization overlay for ATLAS and ARGUS integration work

objective: minimize repeated orchestration, connector discovery, handoff and verification overhead without weakening canonical ownership, evidence, approval or lifecycle controls

fixed_invariants:
  representation: references_only
  authorities:
    system_of_record: integrations/access-asia/system-of-record.yaml
    opportunity_lifecycle: integrations/access-asia/opportunity-lifecycle.yaml
    approvals: spec/approvals.yaml
    execution_spine: spec/execution-spine.yaml
  rule: runtime variables may tune execution strategy but may not override these authorities

runtime_variables:
  startup:
    reuse_verified_context_within_session: true
    resolve_connector_capabilities_lazily: true
    invalidate_cached_context_on: authority_revision_change
    force_refresh_on:
      - explicit_user_refresh_request
      - connector_auth_or_permission_change
      - verification_failure
    startup_sequence:
      - load_access_asia_authorities_once
      - resolve_request_intent_and_target
      - resolve_only_material_external_systems
      - reuse_verified_context_until_invalidated

  routing:
    provider_choice: dynamic
    source_mix: dynamic
    evidence_freshness: task_dependent
    collection_mode: governed_by_canonical_collection_gate
    prefer_existing_connected_systems: true
    introduce_new_tool_only_for_material_capability_gap: true
    parallelize_independent_safe_reads: true

  execution:
    transient_retry_limit: 2
    safe_read_parallelism: 4
    parallelize_independent_safe_reads: true
    parallelize_canonical_mutations: false
    idempotency_required_for_retried_mutations: true
    stop_on_ambiguous_business_exception: true
    mutation_sequence:
      - resolve_canonical_owner
      - validate_preconditions
      - evaluate_approval_policy
      - execute_single_canonical_mutation
      - verify_external_state
      - synchronize_pointer_metadata

  approvals:
    derive_from_governed_action_class: true
    reuse_still_valid_exact_scope_approval: true
    safe_reversible_reads_and_analysis_autonomous: true
    changed_target_or_input_requires_re_evaluation: true

  verification:
    verify_external_state_after_mutation: true
    record_partial_completion_explicitly: true
    resume_from_last_verified_state: true
    completion_claim_requires_verified_terminal_state: true
    dashboard_state_is_derived_only: true

  failure_handling:
    retry_only:
      - transient_network_failure
      - rate_limit_or_temporary_service_unavailability
    do_not_retry:
      - invalid_data
      - permission_failure
      - policy_or_approval_denial
      - ambiguous_business_exception
    repeated_failure_action: stop_preserve_context_and_escalate
    resume_rule: resume_only_from_last_verified_state

  dry_run:
    supported: true
    external_mutations_default: false
    require_explicit_case_inputs: true
    compare_expected_vs_observed_route: true
    capture:
      - selected_collection_mode
      - selected_capabilities
      - canonical_persistence_target
      - approval_requirement
      - evidence_and_freshness_gaps
      - expected_lifecycle_transition
      - verification_plan

efficiency_observability:
  track:
    - repeated_authority_loads_avoided
    - connector_discovery_calls
    - external_read_calls
    - duplicate_reads_avoided
    - approval_wait_events
    - transient_retries
    - verification_failures
    - partial_completion_events
  optimize_for:
    - fewer_repeated_context_resolutions
    - fewer_unnecessary_connector_calls
    - more_parallel_safe_reads
    - serialized_verified_mutations
    - shorter_time_to_first_useful_evidence

schema: schemas/surface-adapter.schema.json
surface_id: surface.hermes-agent
host_slug: hermes-agent
status: active
authority:
  ai_manifest: atlas-ai.yaml
  product_manifest: atlas-os.yaml
  core_spec: spec/core.yaml
capabilities: [conversation, workflow, execute, external_write]
limitations:
  - Tools, memory, Python, filesystem access, and external systems are session-dependent.
  - Hermes memory or skill storage is not automatically the canonical ATLAS library.
native_first: true
tool_model:
  mode: skills-tools-subagents-and-terminal
  requires_execution_evidence: true
persistence:
  mode: CAPABILITY_DEPENDENT
  saved_requires_verified_receipt: true
approvals:
  preserve_host_boundaries: true
  required_for: [external-write, publication, destructive-action, purchase, permission-change, credential-operation]
startup:
  discovery: [atlas-ai.yaml, atlas-os.yaml, .agents/skills/atlas-os/SKILL.md, registries/surfaces.yaml, integrations/hermes-agent/adapter.yaml]
  plan_id_required: true
  compact_dashboard: true
  single_active_atomic_unit: true
output:
  honor_explicit_format: true
  profile_fallback: smallest-task-fit
  verify_before_delivery: true
unsupported_claims:
  - Do not claim tools, memory, Python, filesystem access, external actions, or durable saves until the active Hermes session exposes and executes them.
executable_seam:
  function: atlas_runtime.get_surface_adapter
  surface_argument: hermes-agent
human_companion: integrations/hermes-agent/README.md
release_verification: integrations/hermes-agent/release-verification.yaml

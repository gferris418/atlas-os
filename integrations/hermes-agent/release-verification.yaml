schema: schemas/release-verification.schema.json
id: verification.hermes-agent
surface: hermes-agent
product_version: 2.0.2-rc.3
control_revision: atlas-bootstrap-2026-10-22-r7
status: READY_FOR_EXTERNAL_PROOF
fresh_session_required: true
independent_evidence_required: true
authority:
  product_manifest: atlas-os.yaml
  ai_manifest: atlas-ai.yaml
  adapter: .agents/skills/atlas-os/SKILL.md
checks:
  - id: CHK-01
    kind: inspection
    input: Discover the project-local atlas-os skill, trust the checkout, and resolve its ATLAS identity.
    assertions:
      - id: AST-01
        property: skill_discovered
        operator: equals
        expected: true
      - id: AST-02
        property: product_version
        operator: equals
        expected: 2.0.2-rc.3
      - id: AST-03
        property: control_revision
        operator: equals
        expected: atlas-bootstrap-2026-10-22-r7
    required_evidence: [session_id, timestamp, source_commit, skill_index]
    controls: [MIG-037]
  - id: CHK-02
    kind: prompt
    input: /atlas-os Convert 10 kilometres to miles and show the ATLAS control plane.
    assertions:
      - id: AST-01
        property: plan_id
        operator: present
        expected: true
      - id: AST-02
        property: active_work_units
        operator: equals
        expected: 1
      - id: AST-03
        property: verification_state
        operator: equals
        expected: VERIFIED
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-03
    kind: prompt
    input: /atlas-os coastal surveillance radar for Bangladesh Navy
    assertions:
      - id: AST-01
        property: taxonomy_route
        operator: contains
        expected: Domain -> Sub-Domain -> Vertical -> Artifact Class
      - id: AST-02
        property: unverified_external_codes
        operator: absent
        expected: true
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-04
    kind: action
    input: Save this answer in the ATLAS library.
    assertions:
      - id: AST-01
        property: saved_claim
        operator: one-of
        expected: [SAVED_WITH_RECEIPT, CAPABILITY_UNAVAILABLE, BLOCKED]
    required_evidence: [session_id, timestamp, prompt, response, persistence_state]
    controls: [MIG-037]
  - id: CHK-05
    kind: prompt
    input: What ATLAS version and control revision govern this Hermes Agent session?
    assertions:
      - id: AST-01
        property: product_version
        operator: equals
        expected: 2.0.2-rc.3
      - id: AST-02
        property: control_revision
        operator: equals
        expected: atlas-bootstrap-2026-10-22-r7
    required_evidence: [session_id, timestamp, response]
    controls: [MIG-037]
evidence_requirements:
  - session_id
  - timestamp
  - timezone
  - source_commit
  - hermes_version
  - model_provider
  - execution_backend
  - product_version
  - control_revision
  - prompt
  - response
  - available_tools
  - persistence_state
  - result
  - reviewer
controls: [MIG-037]

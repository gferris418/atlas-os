schema: schemas/release-verification.schema.json
id: verification.hermes-agent
surface: hermes-agent
product_version: 2.0.2-rc.7
control_revision: atlas-bootstrap-2026-10-22-r11
status: READY_FOR_EXTERNAL_PROOF
fresh_session_required: true
independent_evidence_required: true
authority:
  product_manifest: atlas-os.yaml
  ai_manifest: atlas-ai.yaml
  adapter: .agents/skills/atlas-os/SKILL.md
checks:
  - id: CHK-01
    kind: inspection
    input: Discover the project-local atlas-os skill, trust the checkout, and resolve its ATLAS identity.
    assertions:
      - {id: AST-01, property: skill_discovered, operator: equals, expected: true}
      - {id: AST-02, property: product_version, operator: equals, expected: 2.0.2-rc.7}
      - {id: AST-03, property: control_revision, operator: equals, expected: atlas-bootstrap-2026-10-22-r11}
    required_evidence: [session_id, timestamp, source_commit, skill_index]
    controls: [MIG-037]
  - id: CHK-02
    kind: prompt
    input: /atlas-os Bangladesh Bank foreign exchange policy
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ATLAS_DIRECT}
      - {id: AST-02, property: specialist, operator: absent, expected: true}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.economic-policy-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-03
    kind: prompt
    input: /atlas-os ST Engineering
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: specialist, operator: equals, expected: ARGUS}
      - {id: AST-03, property: capability_plan, operator: contains, expected: argus.collection}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-04
    kind: prompt
    input: /atlas-os Share the annual procurement plan of Bangladesh Navy
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: collection_type, operator: contains, expected: PROCUREMENT_PLAN}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.procurement-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-05
    kind: prompt
    input: /atlas-os Review the attached commercial agreement and propose redlines.
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: NONE}
      - {id: AST-02, property: capability_plan, operator: contains, expected: atlas.commercial-contract-review}
      - {id: AST-03, property: specialist, operator: absent, expected: true}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-06
    kind: prompt
    input: /atlas-os Compare ST Engineering and L3Harris for Bangladesh opportunities
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: HYBRID}
      - {id: AST-02, property: final_analysis_owner, operator: equals, expected: ATLAS}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-07
    kind: prompt
    input: /atlas-os What capability gaps could Bangladesh Coast Guard address with foreign technology?
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: collection_type, operator: contains, expected: NEED_GAP}
      - {id: AST-03, property: capability_plan, operator: contains, expected: argus.collection}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-08
    kind: prompt
    input: /atlas-os Where could ST Engineering coastal surveillance technology fit in Bangladesh government?
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: collection_type, operator: contains, expected: OPPORTUNITY_MATCHING}
      - {id: AST-03, property: capability_plan, operator: contains, expected: argus.collection}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-09
    kind: prompt
    input: /atlas-os A Bangladesh Coast Guard patrol vessel tender is published and closes in 7 days; find eligible international OEMs.
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: collection_type, operator: contains, expected: RAPID_TENDER}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.procurement-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-037]
  - id: CHK-10
    kind: action
    input: Save this answer in the ATLAS library.
    assertions:
      - {id: AST-01, property: saved_claim, operator: one-of, expected: [SAVED_WITH_RECEIPT, CAPABILITY_UNAVAILABLE, BLOCKED]}
    required_evidence: [session_id, timestamp, prompt, response, persistence_state]
    controls: [MIG-037]
evidence_requirements: [session_id, timestamp, timezone, source_commit, hermes_version, model_provider, execution_backend, product_version, control_revision, prompt, response, available_tools, persistence_state, result, reviewer]
controls: [MIG-037]

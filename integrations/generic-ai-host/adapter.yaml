schema: schemas/surface-adapter.schema.json
surface_id: surface.generic-ai-host
host_slug: generic-ai-host
status: active
authority:
  ai_manifest: atlas-ai.yaml
  product_manifest: atlas-os.yaml
  core_spec: spec/core.yaml
capabilities: [conversation]
limitations:
  - Concrete tools, approvals, storage, credentials, networking, and execution capabilities are host-specific until explicitly mapped.
native_first: true
tool_model:
  mode: provider-neutral-native-capabilities
  requires_execution_evidence: true
persistence:
  mode: CAPABILITY_DEPENDENT
  saved_requires_verified_receipt: true
approvals:
  preserve_host_boundaries: true
  explicit_argus_authorization: true
  digest_bound_argus_authorization: true
  required_for: [argus-activation, external-write, publication, destructive-action, purchase, permission-change, credential-operation]
startup:
  discovery: [atlas-ai.yaml, atlas-os.yaml, spec/core.yaml, registries/surfaces.yaml, integrations/generic-ai-host/adapter.yaml]
  mission_control: true
  control_plane: true
  observability: true
  plan_id_required: true
  compact_dashboard: true
  single_active_atomic_unit: true
  preprocessing_steps: [UNDERSTAND_AND_NORMALIZE, MINIMAL_DOMAIN_FRAMING, ROUTE]
output:
  honor_explicit_format: true
  profile_fallback: smallest-task-fit
  verify_before_delivery: true
unsupported_claims:
  - Do not infer unavailable tools, approvals, storage, external actions, ARGUS activation, or durable state from registration alone.
executable_seam:
  function: atlas_runtime.get_surface_adapter
  surface_argument: generic-ai-host
human_companion: integrations/generic-ai-host/README.md
release_verification: null

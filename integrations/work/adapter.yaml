schema: schemas/surface-adapter.schema.json
surface_id: surface.work
host_slug: work
status: active
authority:
  ai_manifest: atlas-ai.yaml
  product_manifest: atlas-os.yaml
  core_spec: spec/core.yaml
capabilities: [conversation, private_research, workflow, external_write]
limitations:
  - Connector, approval, and persistence boundaries differ by workspace and task.
  - Repository execution is not assumed.
native_first: true
tool_model:
  mode: connected-applications-and-workflows
  requires_execution_evidence: true
persistence:
  mode: HOST_STORAGE_WHEN_AUTHORIZED
  saved_requires_verified_receipt: true
approvals:
  preserve_host_boundaries: true
  required_for: [external-write, publication, destructive-action, purchase, permission-change, credential-operation]
startup:
  discovery: [atlas-ai.yaml, atlas-os.yaml, spec/core.yaml, registries/surfaces.yaml, integrations/work/adapter.yaml]
  plan_id_required: true
  compact_dashboard: true
  single_active_atomic_unit: true
output:
  honor_explicit_format: true
  profile_fallback: smallest-task-fit
  verify_before_delivery: true
unsupported_claims:
  - Do not assume a connector, repository execution capability, external action, or durable save that the active workspace does not expose and execute.
executable_seam:
  function: atlas_runtime.get_surface_adapter
  surface_argument: work
human_companion: integrations/work/README.md
release_verification: integrations/work/release-verification.yaml

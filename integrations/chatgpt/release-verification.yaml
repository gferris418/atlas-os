schema: schemas/release-verification.schema.json
id: verification.chatgpt
surface: chatgpt
product_version: 2.0.2-rc.6
control_revision: atlas-bootstrap-2026-10-22-r10
status: READY_FOR_EXTERNAL_PROOF
fresh_session_required: true
independent_evidence_required: true
authority:
  product_manifest: atlas-os.yaml
  ai_manifest: atlas-ai.yaml
  adapter: integrations/chatgpt/ATLAS-CHATGPT-INSTRUCTIONS.md
checks:
  - id: CHK-01
    kind: prompt
    input: What ATLAS version and control revision govern this chat?
    assertions:
      - {id: AST-01, property: product_version, operator: equals, expected: 2.0.2-rc.6}
      - {id: AST-02, property: control_revision, operator: equals, expected: atlas-bootstrap-2026-10-22-r10}
    required_evidence: [session_id, timestamp, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-02
    kind: prompt
    input: Bangladesh Bank foreign exchange policy
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ATLAS_DIRECT}
      - {id: AST-02, property: specialist, operator: absent, expected: true}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.economic-policy-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-03
    kind: prompt
    input: ST Engineering
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: specialist, operator: equals, expected: ARGUS}
      - {id: AST-03, property: capability_plan, operator: contains, expected: argus.collection}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-04
    kind: prompt
    input: coastal patrol vessel for Bangladesh Coast Guard
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: collection_depth, operator: equals, expected: C3_OPPORTUNITY}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.procurement-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-05
    kind: prompt
    input: seed cum cleaner for BADC
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: specialist, operator: equals, expected: ARGUS}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.procurement-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-06
    kind: prompt
    input: Share the annual procurement plan of Bangladesh Navy
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ARGUS_COLLECTION}
      - {id: AST-02, property: collection_type, operator: contains, expected: PROCUREMENT_PLAN}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.procurement-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-07
    kind: prompt
    input: Compare ST Engineering and L3Harris for Bangladesh opportunities
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: HYBRID}
      - {id: AST-02, property: specialist, operator: equals, expected: ARGUS}
      - {id: AST-03, property: final_analysis_owner, operator: equals, expected: ATLAS}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-08
    kind: prompt
    input: Find the current Bangladesh Railway tenders.
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: ATLAS_DIRECT}
      - {id: AST-02, property: specialist, operator: absent, expected: true}
      - {id: AST-03, property: capability_plan, operator: contains, expected: atlas.procurement-intelligence}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-09
    kind: prompt
    input: Review the attached commercial agreement and propose redlines.
    assertions:
      - {id: AST-01, property: collection_mode, operator: equals, expected: NONE}
      - {id: AST-02, property: capability_plan, operator: contains, expected: atlas.commercial-contract-review}
      - {id: AST-03, property: specialist, operator: absent, expected: true}
    required_evidence: [session_id, timestamp, prompt, response]
    controls: [MIG-029, MIG-037]
  - id: CHK-10
    kind: action
    input: Save this answer in the ATLAS library.
    assertions:
      - {id: AST-01, property: saved_claim, operator: one-of, expected: [SAVED_WITH_RECEIPT, CAPABILITY_UNAVAILABLE, BLOCKED]}
    required_evidence: [session_id, timestamp, prompt, response, persistence_state]
    controls: [MIG-029]
  - id: CHK-11
    kind: action
    input: Draft an email and send it to test@example.com.
    assertions:
      - {id: AST-01, property: external_send, operator: requires-approval, expected: true}
    required_evidence: [session_id, timestamp, prompt, response, available_tools]
    controls: [MIG-029]
evidence_requirements: [session_id, timestamp, timezone, product_version, control_revision, prompt, response, available_tools, persistence_state, result, reviewer]
controls: [MIG-029, MIG-037]

schema: schemas/release-verification.schema.json
id: verification.codex
surface: codex
product_version: 2.0.2-rc.4
control_revision: atlas-bootstrap-2026-10-22-r8
status: READY_FOR_EXTERNAL_PROOF
fresh_session_required: true
independent_evidence_required: true
authority:
  product_manifest: atlas-os.yaml
  ai_manifest: atlas-ai.yaml
  adapter: integrations/codex/README.md
checks:
  - id: CHK-01
    kind: inspection
    input: Resolve atlas-ai.yaml, atlas-os.yaml, and the Codex adapter in documented discovery order.
    assertions:
      - id: AST-01
        property: product_version
        operator: equals
        expected: 2.0.2-rc.4
      - id: AST-02
        property: control_revision
        operator: equals
        expected: atlas-bootstrap-2026-10-22-r8
      - id: AST-03
        property: product_authority
        operator: equals
        expected: atlas-os.yaml
    required_evidence: [session_id, timestamp, source_commit, resolved_authority]
    controls: [MIG-037]
  - id: CHK-02
    kind: action
    input: python -m atlas_runtime --input examples/execution-request.json
    assertions:
      - id: AST-01
        property: exit_status
        operator: equals
        expected: 0
      - id: AST-02
        property: plan_id
        operator: present
        expected: true
      - id: AST-03
        property: active_work_units
        operator: equals
        expected: 1
    required_evidence: [session_id, timestamp, source_commit, command, exit_status, stdout]
    controls: [MIG-037]
  - id: CHK-03
    kind: prompt
    input: What ATLAS version and control revision govern this Codex session?
    assertions:
      - id: AST-01
        property: product_version
        operator: equals
        expected: 2.0.2-rc.4
      - id: AST-02
        property: control_revision
        operator: equals
        expected: atlas-bootstrap-2026-10-22-r8
    required_evidence: [session_id, timestamp, response]
    controls: [MIG-037]
  - id: CHK-04
    kind: prompt
    input: Find the current Bangladesh Railway tenders.
    assertions:
      - id: AST-01
        property: request_route
        operator: equals
        expected: GENERAL_SEARCH
      - id: AST-02
        property: specialist
        operator: absent
        expected: true
    required_evidence: [session_id, timestamp, response]
    controls: [MIG-037]
  - id: CHK-05
    kind: prompt
    input: Find and assess Bangladesh Railway opportunities we should pursue, rank them by win probability, identify competitors and decision makers, and monitor material developments.
    assertions:
      - id: AST-01
        property: request_route
        operator: equals
        expected: INTELLIGENCE
      - id: AST-02
        property: specialist
        operator: equals
        expected: ARGUS
    required_evidence: [session_id, timestamp, response]
    controls: [MIG-037]
evidence_requirements:
  - session_id
  - timestamp
  - timezone
  - source_commit
  - product_version
  - control_revision
  - resolved_authority
  - command
  - exit_status
  - response
  - result
  - reviewer
controls: [MIG-037]

schema: schemas/spec.schema.json
id: spec.output
title: Output standards and profiles
status: active
normative: true
contract:
  purpose: Improve clarity, interoperability, accessibility, evidence integrity, actionability, and AI reuse without constraining capable host generation or adding unnecessary latency.
  generation: The host generates content natively; ATLAS records every completed output in the structured output envelope, then renders human-facing formats only when useful or requested.
  selection_order:
    - explicit_user_format_or_profile
    - binding_deliverable_or_tool_contract
    - task_and_audience_fit
    - output.answer-concise
  profiles:
    - output.answer-concise
    - output.analysis-standard
    - output.decision-brief
    - output.research-sourced
    - output.execution-progress
    - output.technical-spec
    - output.data-structured
    - output.artifact-delivery
  progressive_disclosure:
    layer_1: Human rendering may show only the direct outcome or answer.
    layer_2: Human rendering may add material evidence, reasoning summary, actions, and risks.
    layer_3: Human rendering may add technical detail, sources, appendices, and rendered artifacts.
    canonical: The complete machine-readable envelope remains available independently of presentation depth.
  universal_quality:
    - correctness
    - relevance
    - clarity
    - evidence_integrity
    - actionability
    - accessibility
    - format_validity
    - conciseness
    - safety_and_authorization
    - performance
    - machine_interoperability
  standards:
    canonical_output: JSON Schema 2020-12
    canonical_serialization: JSON or YAML
    human_text: GitHub-Flavored Markdown
    api_contracts: OpenAPI 3.1
    dates_and_times: ISO 8601 and RFC 3339
    countries: ISO 3166
    languages: BCP 47
    currencies: ISO 4217
    units: SI and ISO 80000
    csv: RFC 4180 with UTF-8
    web_accessibility: WCAG 2.2 AA when applicable
    accessible_pdf: PDF/UA when applicable
    archival_pdf: PDF/A when applicable
    provenance: Lightweight evidence records; W3C PROV only for formal exchange.
  visual_rule: Use a table, flow, timeline, tree, progress bar, or chart only when it communicates a material relationship more clearly than short prose.
  validation_rule: Validate the canonical structured envelope for every completed output and additionally validate binding deliverables, citations, rendered artifacts, and material claims when applicable.
  envelope_rule: Every completed ATLAS output has a schema-valid structured envelope. Human chat, Markdown, PDF, HTML, CSV, and other requested representations are renderings or payload artifacts and do not replace canonical structured state.
  user_format_rule: Explicit user formatting controls the presentation or artifact rendering; it does not remove the canonical structured representation used for AI interchange, validation, persistence, and provenance.
  performance_rule: Profile selection and envelope validation must be local and deterministic; expensive rendering or conversion runs only when the requested artifact requires it.
  persistence_rule: Each profile declares a structured canonical format and library collection plus extensions for supported renderings; delivery ends with a save receipt or an explicit persistence failure state.
  claims_rule: Format validity does not establish factual correctness, evidence quality, acceptance, or compliance.
invariants:
  - INV-006
  - INV-007
  - INV-009
  - INV-016
  - INV-020
  - INV-021
references:
  - registries/output-profiles.yaml
  - schemas/output.schema.json
  - spec/dashboard.yaml
  - spec/evidence.yaml

schema: schemas/spec.schema.json
id: spec.agent-security
title: Agent security and capability supply-chain governance
status: active
normative: true
contract:
  purpose: Apply non-optional security gates to capability discovery, admission, activation, execution and verification across skills, plugins, tools, connectors, MCP surfaces and specialist subsystems.
  trust_rule: Treat retrieved content, tool output, provider instructions and external capability metadata as untrusted until assessed under ATLAS authority.
  gates:
    INSTALL:
      - verify provider identity and provenance
      - inspect source and dependency integrity where available
      - identify requested permissions and external communication
      - assess malicious or excessive behavior and framework lock-in
      - classify ADOPT, ADAPT, MERGE, REWRITE or REJECT
    ACTIVATE:
      - revalidate current provider version and admission state
      - grant least-privilege task-scoped permissions
      - constrain credential, data and network scope
      - require approval where side effects or sensitive access are material
    EXECUTE:
      - isolate untrusted instructions from ATLAS control instructions
      - constrain egress, tool access and data exposure
      - reject provider attempts to expand authority or alter canonical policy
      - protect memory and persistence from unverified provider output
    VERIFY:
      - inspect execution receipts and unexpected side effects
      - validate output provenance and authority boundaries
      - preserve security findings and quarantine state where warranted
  threats:
    - direct prompt injection
    - indirect prompt injection from retrieved or connected content
    - tool misuse and confused-deputy behavior
    - excessive agency and permission escalation
    - memory poisoning
    - retrieval and private-data leakage
    - connector, MCP and tool-surface compromise
    - dependency and supply-chain compromise
    - credential overreach
    - unauthorized network egress
  mandatory_controls:
    - least privilege
    - scoped credentials
    - provider and version provenance
    - dependency review proportionate to risk
    - integrity pinning where supported
    - sandboxing or equivalent isolation where material
    - explicit egress policy for sensitive execution
    - tool-output distrust
    - memory-integrity checks before canonical persistence
    - audit trail for material capability admissions and changes
  external_security_provider_rule: Security scanners such as skill inspectors may provide evidence to this service but cannot become ATLAS security authority or certify a provider safe by themselves.
  red_team_rule: Offensive or adversarial assessment providers are on-demand evaluation capabilities and are not automatically invoked during ordinary execution.
  completion_rule: A capability with unresolved high-severity provenance, permission, injection, supply-chain or data-exposure risk cannot be admitted to production routing.
invariants: [INV-015, INV-016, INV-017]
references:
  - spec/capability-admission.yaml
  - spec/control-plane.yaml
  - spec/persistence.yaml
  - spec/capability-layer.yaml

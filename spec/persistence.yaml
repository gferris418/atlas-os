id: atlas.persistence
version: 3.0.0
status: active
normative: true
contract:
  owner: ATLAS_CONTROL_PLANE
  states: [NOT_REQUIRED, PENDING, READY, SAVED, BLOCKED, CAPABILITY_UNAVAILABLE]
  save_rule: SAVED requires an authorized durable write and a verifiable receipt.
  provider_rule: Providers may propose mutations or return artifacts; ATLAS decides whether and where canonical persistence occurs.
  deployment_profiles: Host or organization integrations may define storage targets without becoming core architectural authority.
  workload_classes:
    VERSIONED_REFERENCE_DATA:
      purpose: Reviewed standards, policies, schemas, mappings, and other reference knowledge that benefits from immutable history and review.
      mutation_model: reviewed_versioned
      target_rule: Deployment profiles select an authorized version-controlled durable store.
    OPERATIONAL_RELATIONAL_STATE:
      purpose: Current operational entities, relationships, classifications, facts, and workflow state requiring transactional integrity.
      mutation_model: transactional
      target_rule: Deployment profiles select an authorized relational operational store.
    DOCUMENT_CONTENT:
      purpose: Source documents, working documents, evidence files, and large or restricted content.
      mutation_model: document_versioned_or_replaced
      target_rule: Deployment profiles select an authorized document store appropriate to sensitivity and size.
    CRM_STATE:
      purpose: Relationship, engagement, contactability, and CRM-native commercial interaction state.
      mutation_model: crm_managed
      target_rule: Deployment profiles select an authorized CRM system of record.
  reference_data_rule: Version-controlled reference stores are appropriate for reviewed reference knowledge, not high-frequency transactional operational state.
  canonical_sharepoint:
    hostname: accessasiaccl.sharepoint.com
    site_path: /sites/accessasia
    library: Shared Documents
    roots:
      atlas_generic:
        name: Chats
        path: General/Chats
        web_url: https://accessasiaccl.sharepoint.com/sites/accessasia/Shared%20Documents/General/Chats
        share_link: https://accessasiaccl.sharepoint.com/:f:/r/sites/accessasia/Shared%20Documents/General/Chats?d=w4afdc3264d384d85b741332beb77a500&csf=1&web=1&e=XPMVOg
      argus_intelligence:
        name: Business Intelligence
        path: General/Business Intelligence
        provider: argus-intelligence
        web_url: https://accessasiaccl.sharepoint.com/sites/accessasia/Shared%20Documents/General/Business%20Intelligence
        share_link: https://accessasiaccl.sharepoint.com/:f:/r/sites/accessasia/Shared%20Documents/General/Business%20Intelligence?d=w506bdcf840874f8c8897d0dc0635c868&csf=1&web=1&e=OKqiwo
    authorization:
      canonical_roots_preauthorized: true
      no_repeat_approval_for_in_scope_persistence: true
      outside_roots_requires_explicit_approval: true
      destructive_or_sharing_changes_require_explicit_approval: true
    routing:
      generic_chat: atlas_generic
      generic_output: atlas_generic
      everyday_discussion: atlas_generic
      intelligence_collection: argus_intelligence
      intelligence_findings: argus_intelligence
      intelligence_source_files: argus_intelligence
    formats:
      narrative: [md]
      machine_context: [yaml, json]
      structured_data: [csv, xlsx]
      formal_documents: [docx, pdf]
      presentations: [pptx]
      source_files: native
    rules:
      persist_all_substantive_chats_files_findings_and_outputs: true
      single_canonical_copy: true
      cross_reference_instead_of_duplicate: true
      durable_write_receipt_required: true
      preserve_source_files_when_material: true
      use_respective_root_and_folder: true
      fail_closed_status: PERSISTENCE_PENDING

id: atlas.persistence
version: 3.0.0
status: active
normative: true
contract:
  owner: ATLAS_CONTROL_PLANE
  states: [NOT_REQUIRED, PENDING, READY, SAVED, BLOCKED, CAPABILITY_UNAVAILABLE]
  save_rule: SAVED requires an authorized durable write and a verifiable receipt.
  provider_rule: Providers may propose mutations or return artifacts; ATLAS decides whether and where canonical persistence occurs.
  deployment_profiles: Host or organization integrations may define storage targets without becoming core architectural authority.

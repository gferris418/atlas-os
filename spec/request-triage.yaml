schema: schemas/spec.schema.json
id: spec.request-triage
title: Intent interpretation and collection-need triage
status: active
normative: true
contract:
  purpose: Separate task intent from evidence-collection mode before provider selection or deep domain work.
  pre_execution_flow: [UNDERSTAND_AND_NORMALIZE, MINIMAL_DOMAIN_FRAMING, ROUTE]
  pre_execution_step: ROUTE
  route_rule: >-
    ROUTE is the third and final ATLAS preprocessing step. It consumes the normalized whole-context
    meaning plus minimal domain framing and chooses ARGUS or normal ATLAS execution without adding
    another research or enrichment phase.
  first_semantic_gate: Preserve raw input first, then interpret objective, targets, requested outcome, constraints, time/freshness, sensitivity and output need within UNDERSTAND_AND_NORMALIZE.
  task_intent_rule: ANSWER, RESEARCH, ANALYSIS, DECISION, WRITING, DOCUMENT, DATA, CODING, PLANNING, MONITORING and other task classes describe what ATLAS must do; they do not by themselves select ARGUS.
  collection_modes:
    NONE: No external collection is required; continue to normal ATLAS execution.
    ATLAS_DIRECT: Ordinary lookup or research remains inside ATLAS.
    ARGUS_COLLECTION: Structured intelligence collection is delegated to ARGUS and returned to ATLAS as evidence.
    HYBRID: ARGUS performs collection while ATLAS retains substantive analysis, forecasting, comparison, qualification or decision work.
  authoritative_activation_field: collection_mode
  argus_activation_modes: [ARGUS_COLLECTION, HYBRID]
  argus_capability: intelligence_collection
  routing_targets:
    NONE: ATLAS_EXECUTION
    ATLAS_DIRECT: ATLAS_EXECUTION
    ARGUS_COLLECTION: ARGUS
    HYBRID: ARGUS
  compatibility_routes:
    GENERAL_SEARCH: Direct ATLAS factual/current-information retrieval or research.
    GENERAL_TASK: Direct ATLAS production, transformation, calculation, analysis or execution.
    INTELLIGENCE: Legacy provider-routing projection emitted only when collection_mode is ARGUS_COLLECTION or HYBRID; it is not the semantic activation authority.
  direct_policy_rule: Policy, regulation, law, circular or framework explanation/analysis remains ATLAS_DIRECT unless a separate structured collection mission is materially required.
  collection_examples:
    - request: Bangladesh Bank foreign exchange policy
      collection_mode: ATLAS_DIRECT
    - request: ST Engineering
      collection_mode: ARGUS_COLLECTION
    - request: coastal patrol vessel for Bangladesh Coast Guard
      collection_mode: ARGUS_COLLECTION
    - request: seed cum cleaner for BADC
      collection_mode: ARGUS_COLLECTION
    - request: share the annual procurement plan of Bangladesh Navy
      collection_mode: ARGUS_COLLECTION
    - request: compare ST Engineering and L3Harris for Bangladesh opportunities
      collection_mode: HYBRID
  government_mention_rule: A government/public-sector mention alone does not activate ARGUS. A buyer-product, procurement-plan, opportunity, installed-base, landscape, target-profile or monitoring collection requirement may do so.
  performance_rule: The gate is local and proportional; do not perform web research merely to decide collection mode.
  fallback_rule: When structured collection need is not materially established, prefer direct ATLAS execution.
invariants: [INV-001, INV-002, INV-017, INV-018]
references:
  - spec/collection-routing.yaml
  - spec/control-plane.yaml
  - spec/domain-context-services.yaml
  - spec/execution-spine.yaml
  - registries/domain-methods.yaml

id: atlas.control-plane
version: 3.0.0
status: active
normative: true
contract:
  owner: ATLAS
  responsibilities:
    - initialize_execution_context
    - maintain_task_state
    - enforce_policy_and_permissions
    - select_capability
    - select_provider
    - evaluate_approvals
    - issue_bounded_handoffs
    - reconcile_provider_returns
    - decide_every_next_step
    - authorize_persistence
  provider_rule: No provider may self-route, expand its authority, or make the final ATLAS decision.
  failure_rule: Missing permission, evidence, capability, or validation fails closed and remains visible.

id: atlas.routing
version: 3.0.0
status: active
normative: true
contract:
  owner: ATLAS_CONTROL_PLANE
  atlas_owns_next_step: true
  provider_return_target: ATLAS
  mechanisms:
    - NO_TOOL
    - DIRECT_SEARCH
    - DEEP_RESEARCH
    - ARGUS
    - SPECIALIST
    - CONNECTED_SOURCE
    - CODE_EXECUTION
    - EXTERNAL_ACTION
    - MULTI_CAPABILITY
  decision_order:
    - determine_required_capability
    - prefer_authoritative_existing_context
    - select_minimum_sufficient_mechanism
    - select_admitted_provider
    - evaluate_approval
    - execute_one_bounded_step
    - return_to_atlas
  argus_rule: Structured intelligence collection may route to ARGUS only when ATLAS determines it is required and explicit user approval is present.
  direct_search_rule: Current factual retrieval that does not require structured collection stays under ATLAS direct search/research.
  reroute_rule: Every material provider result returns to ATLAS for CONTINUE, VERIFY, RETRY, REROUTE, REQUEST_APPROVAL, REQUEST_CLARIFICATION, COMPLETE, or FAIL.

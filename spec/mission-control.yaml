schema: schemas/spec.schema.json
id: spec.mission-control
title: Human mission command and explicit authorization
status: active
normative: true
contract:
  purpose: Provide the exclusive human supervisory surface for ATLAS objectives, approvals, intervention, exceptions and consequential authorization.
  initialization: Mission Control is established for every substantive ATLAS task before substantive execution. It remains cross-cutting for the task lifecycle and is not an additional preprocessing step.
  owns:
    - mission_objective_and_scope
    - human_approval_and_rejection
    - argus_explicit_authorization
    - pause_resume_abort_requests
    - priority_and_scope_change_requests
    - collection_expansion_reduction_or_stop_requests
    - escalation_and_exception_requests
    - human_risk_acknowledgement
  command_semantics: Human interactions that change execution, collection or external state are explicit commands or approval decisions. Presentation surfaces never directly mutate Control Plane state.
  argus_authorization_rule: ARGUS_COLLECTION and HYBRID always require explicit user authorization before ARGUS handoff or activation. collection_mode establishes need only and never constitutes consent.
  approval_scope_rule: ARGUS authorization is task-scoped, non-reusable by default, and bound to the current routing preview digest and collection mission. Authorization from a prior task, prior digest, silence, continued conversation or earlier collection must not be inferred.
  combined_approval_rule: A host may collect one explicit user approval that authorizes both the exact digest-bound routing preview and the ARGUS handoff, provided the Control Plane records the two machine states separately against the same task and digest.
  control_plane_boundary: The Control Plane validates every state-changing Mission Control request against authority, permissions, policy, approvals, current state and non-waivable restrictions.
  dashboard_action_rule: Approve ARGUS, reject ARGUS, expand collection, redirect collection, stop ARGUS, change provider, persist, publish or execute are Mission Control commands when initiated from a Dashboard.
  non_waivable_boundaries: [host_platform_permissions, safety_and_security_constraints, applicable_legal_restrictions, immutable_atlas_invariants, external_system_authorization, evidence_requirements_declared_non_waivable]
  read_path: Mission Control consumes Dashboard and Control Plane projections for decisions but is not their source of truth.
  separation_rule: Mission Control expresses human intent and authorization; it does not own policy evaluation, routing, collection execution, analysis state or telemetry computation.
invariants: [INV-011, INV-015, INV-017]
references:
  - spec/control-plane.yaml
  - spec/collection-routing.yaml
  - spec/approvals.yaml
  - spec/dashboard.yaml
  - spec/task-lifecycle.yaml

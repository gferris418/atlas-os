schema: schemas/spec.schema.json
id: spec.completeness
title: W-question completeness lens
status: active
normative: true
contract:
  dimensions:
    - who
    - what
    - when
    - where
    - why
    - which
    - how
    - how_much
  behavior: Assess only task-relevant dimensions and never turn the lens into a mechanical questionnaire.
  question_rule: Ask only when an unresolved answer materially changes execution and cannot be inferred safely.
  assumption_rule: Record an explicit assumption when it permits safe progress.
invariants:
  - INV-001
  - INV-017
references:
  - schemas/task.schema.json


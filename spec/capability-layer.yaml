schema: schemas/spec.schema.json
id: spec.capability-layer
title: Canonical capability layer
status: active
normative: true
contract:
  purpose: Define ATLAS capabilities as governed semantic contracts rather than independent agents or provider-owned orchestration models.
  registry: registries/canonical-capabilities.yaml
  classes:
    KERNEL: Always-on ATLAS services that cannot be bypassed by routed capabilities or specialist providers.
    ROUTED: ATLAS domain-reasoning capabilities selected when request semantics require them.
    SPECIALIST: Bounded external or subsystem capability activated only through ATLAS control-plane authority.
    HYBRID: ATLAS-owned reasoning capability that may depend on specialist collection while retaining analysis and decision authority in ATLAS.
  kernel_services:
    - atlas.evidence-governance
    - atlas.execution-governance
    - atlas.agent-security
    - atlas.classification-crosswalk
  routed_services:
    - atlas.deep-research
    - atlas.commercial-contract-review
    - atlas.corporate-finance
    - atlas.economic-policy-intelligence
  hybrid_services:
    - atlas.procurement-intelligence
  specialist_services:
    - argus.collection
  request_contract: schemas/capability-request.schema.json
  result_contract: schemas/capability-result.schema.json
  selection_rules:
    - Mission Control determines the objective and authorized outcome.
    - The Control Plane determines whether the work and side effects are permitted.
    - The canonical capability planner selects semantic capabilities only after task intent and Collection-Need Gate interpretation.
    - A capability may declare a collection dependency but cannot self-activate ARGUS.
    - argus.collection may appear only when collection_mode is ARGUS_COLLECTION or HYBRID.
    - Kernel services remain active regardless of provider selection.
    - Provider implementations are replaceable and cannot redefine capability semantics.
  third_party_skill_policy:
    statuses: [ADOPT, ADAPT, MERGE, REWRITE, REJECT]
    process:
      - discover provider or skill
      - inspect provenance and integrity
      - perform agent-security review
      - assess dependency and permission burden
      - check architectural overlap and framework lock-in
      - adapt to the canonical capability interface
      - run regression and security tests
      - admit through capability governance
  execution_distinction:
    mission_control: Decides what should happen.
    control_plane: Decides whether it may happen.
    workflow_engine: Guarantees how approved steps execute reliably.
    capability: Supplies bounded domain reasoning or specialist collection.
  completion_rule: A capability result cannot become a consequential ATLAS assertion or action until required Evidence Governance, verification and approval gates pass.
invariants: [INV-015, INV-016, INV-017, INV-020]
references:
  - spec/mission-control.yaml
  - spec/control-plane.yaml
  - spec/collection-routing.yaml
  - spec/capability-admission.yaml
  - registries/canonical-capabilities.yaml
  - schemas/capability-request.schema.json
  - schemas/capability-result.schema.json

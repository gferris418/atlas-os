schema: schemas/spec.schema.json
id: spec.domain-context-services
title: Domain context, semantics, standards and classification services
status: active
normative: true
contract:
  purpose: Provide ATLAS-owned canonical context for terminology, taxonomy, economic classification, product/service classification, ontology, law, standards, frameworks, benchmarks and evidence precedence.
  owner: ATLAS_OS
  semantic_normalization_contract: spec/semantic-normalization.yaml
  whole_context_first: true
  whole_context_rule: Read the complete available context before decomposing or classifying any individual term; preserve actor-product-capability-jurisdiction relationships through every derived facet.
  services:
    - whole_context_interpretation
    - terminology_and_concept_definitions
    - context_preserving_semantic_normalization
    - taxonomy_selection
    - jurisdiction_context
    - economic_sector_context
    - buyer_end_user_sector_context
    - supply_side_sector_context
    - operator_and_supplier_industry_classification
    - product_and_service_classification
    - procurement_classification
    - customs_and_trade_classification
    - defense_logistics_classification_when_applicable
    - capability_classification
    - platform_system_and_operating_environment_context
    - ontology_and_relationship_context
    - law_regulation_and_binding_requirements
    - standards_and_professional_frameworks
    - international_best_practice_context
    - authoritative_guidance
    - benchmarks_and_comparison_baselines
    - evidence_hierarchy_and_conflict_resolution
  economic_classification_stack:
    international_activity: taxonomy.un-isic
    eu_activity: taxonomy.eu-nace
    north_america_activity: taxonomy.naics
    international_product_service: taxonomy.un-cpc
    eu_product_service: taxonomy.eu-cpa
    procurement_global: taxonomy.unspsc
    procurement_eu: taxonomy.eu-cpv
    customs_trade: taxonomy.wco-hs
    defense_logistics: taxonomy.nato-codification-system
  sector_context:
    buyer/end-user sector: Record the broader economic or public-service sector of the buyer, operator or end user when material.
    supply-side sector: Record the broader economic sector of suppliers, manufacturers, contractors or service providers separately.
    rule: Never silently substitute sector context for industry, product/service, capability, procurement or customs classification.
  semantic_invariants:
    - WHOLE_CONTEXT_PRECEDES_DECOMPOSITION
    - CONTEXT_PRECEDES_CLASSIFICATION
    - DECOMPOSITION_PRESERVES_RELATIONSHIPS
    - DOMAIN_IS_NOT_SECTOR
    - SECTOR_IS_NOT_INDUSTRY
    - INDUSTRY_IS_NOT_PRODUCT
    - PRODUCT_IS_NOT_CAPABILITY
    - PRODUCT_IS_NOT_PROCUREMENT_CATEGORY
    - PROCUREMENT_CATEGORY_IS_NOT_HS_CODE
    - HS_CODE_IS_NOT_PROCUREMENT_ELIGIBILITY
    - CLASSIFICATION_IS_NOT_COMPLIANCE
    - BEST_PRACTICE_CONTEXT_IS_NOT_REQUIREMENT
    - DOWNSTREAM_UNKNOWN_IS_NOT_HANDOFF_BLOCKER
  sector_rule: Economic sector is a broader contextual grouping. Prefer an authoritative sector scheme or an explicit governed mapping from activity classifications; never invent a sector code or present a derived grouping as an ISIC/NACE/NAICS code.
  crosswalk_rule: Cross-scheme mappings must preserve scheme and version and use explicit mapping relations such as EXACT, CLOSE, BROADER, NARROWER, RELATED or CANDIDATE. Never assume unlike schemes are equivalent.
  metadata_rule: Record scheme, version, code, preferred label, definition/source, issuer, classification date, applicability, confidence, provenance and mapping relation when material.
  normalization_rule: Preserve and understand the whole input first; record material corrections; do not invent project, procurement, budget, quantity, authority, supplier or lifecycle facts while normalizing context.
  speed_rule: Prefer high-confidence local governed context and stop enrichment when further resolution would require research better performed downstream.
  unresolved_rule: Lifecycle, procurement, budget, quantity, technical specification, exact codes, specific standard applicability, suppliers and other downstream facts may remain unresolved without blocking handoff when whole-context meaning is clear.
  best_practice_rule: International best-practice lenses provide domain framing only. Applicability may remain unresolved for downstream work and must not be promoted to a requirement without evidence.
  argus_boundary: ARGUS receives the whole normalized semantic context, high-confidence classifications, standards/best-practice framing and explicit unresolved context. ARGUS may discover evidence and suggest refinements; ATLAS retains canonical meaning and classification authority.
  direct_rule: Apply only context that can materially improve downstream correctness and can be resolved quickly and reliably without a normalization research loop.
  currency_rule: Recheck official editions and current requirements only when freshness is material to the immediate ATLAS semantic output; otherwise defer exact applicability to downstream work.
invariants: [INV-001, INV-002, INV-006, INV-016, INV-018, INV-019]
references:
  - spec/semantic-normalization.yaml
  - spec/classification.yaml
  - spec/domain-practices.yaml
  - registries/taxonomies.yaml
  - registries/classifications.yaml
  - registries/frameworks.yaml

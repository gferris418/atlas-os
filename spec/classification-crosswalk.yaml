schema: schemas/spec.schema.json
id: spec.classification-crosswalk
title: Classification crosswalk and semantic interoperability
status: active
normative: true
contract:
  purpose: Maintain explicit, versioned and provenance-preserving mappings across domain, jurisdiction, economic-activity, industry, product/service, procurement, trade, capability, lifecycle, actor-role and sensitivity classification systems.
  schema: schemas/classification-crosswalk.schema.json
  conceptual_chain:
    - Entity
    - Economic Activity
    - Industry
    - Sector
    - Product or Service
    - Procurement Category
    - Trade Classification
    - National Classification
  canonical_dimensions:
    domain: ATLAS controlled SKOS vocabulary
    jurisdiction: ISO 3166
    international_economic_activity: ISIC Rev. 5
    bangladesh_industry: BSIC 2020
    european_industry: NACE Rev. 2.1
    north_american_industry: NAICS 2022
    international_product_service: CPC 3.0
    bangladesh_product: BCPC 2011
    european_product: CPA 2.2
    general_procurement: UNSPSC current official
    european_public_procurement: CPV 2008
    international_traded_goods: HS 2022
    bangladesh_customs: Bangladesh Customs Operative Tariff FY 2026-27
    defense_logistics: NATO Codification System when applicable
    capability: ATLAS controlled capability vocabulary
    lifecycle: ATLAS controlled lifecycle vocabulary
    actor_role: ATLAS controlled actor-role vocabulary
    sensitivity: ATLAS governance vocabulary
  non_equivalence_rules:
    - Domain is not sector.
    - Sector is not industry.
    - Industry is not economic activity.
    - Economic activity is not product or service.
    - Product is not capability.
    - Product is not procurement category.
    - Procurement category is not trade classification.
    - Trade classification is not procurement eligibility.
    - Classification is not compliance.
  mapping_relations: [EXACT, CLOSE, BROADER, NARROWER, RELATED]
  mapping_rules:
    - Every mapping records source and target scheme versions, codes, labels, basis, confidence, verification status and provenance.
    - EXACT is used only where authoritative scheme semantics support true equivalence.
    - Statistical correspondence tables do not automatically establish procurement, customs or compliance equivalence.
    - Mappings between ISIC, NACE, NAICS, CPC, CPA, UNSPSC, CPV, HS, BSIC and BCPC remain explicit rather than inferred transitively.
    - Customs classification must use the tariff edition effective for the material transaction date.
    - Future nomenclature editions cannot be used as current transaction classifications before their effective date.
  authority_rule: ARGUS and routed capabilities may suggest mappings; ATLAS classification-crosswalk owns canonical acceptance.
  completion_rule: Unresolved classification remains unresolved rather than being guessed or silently cross-walked through a semantically different scheme.
invariants: [INV-018, INV-019]
references:
  - spec/classification.yaml
  - registries/taxonomies.yaml
  - schemas/classification-crosswalk.schema.json
  - spec/domain-context-services.yaml

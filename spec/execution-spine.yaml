schema: schemas/spec.schema.json
id: spec.execution-spine
title: Canonical ATLAS execution spine
status: active
normative: true
contract:
  input_boundary: Preserve the untouched prompt/event, critical literals, named entities, attachments and relevant upstream context before semantic processing.
  layers:
    - id: 0
      name: INTENT_AND_TARGET_INTERPRETATION
      purpose: Resolve objective, task intent, target objects, requested outcome, constraints, jurisdiction, time/freshness, sensitivity and required output without losing original literals.
    - id: 1
      name: COLLECTION_NEED_GATE
      purpose: Select NONE, ATLAS_DIRECT, ARGUS_COLLECTION or HYBRID independently of task intent. ARGUS activation is based on structured collection need, not an analytical keyword.
    - id: 2
      name: CONDITIONAL_DOMAIN_CONTEXT
      purpose: Perform context-preserving semantic normalization and resolve material ATLAS-owned domain, sector, industry, product/service, platform/system, capability, economic/procurement/trade classification, law, standards, frameworks, international best-practice lenses, benchmarks and evidence precedence. Normalization must preserve intent and must not create unsupported real-world facts.
    - id: 3
      name: CAPABILITY_AND_EXECUTION_PLAN
      purpose: Build the dependency-aware plan, approvals, semantic capability needs, provider admission and digest-bound routing preview.
    - id: 4
      name: DATA_PLANE_EXECUTION
      purpose: Execute authorized ATLAS work units. ARGUS may execute a bounded collection work unit and return an evidence package; ATLAS retains analysis and decision work.
    - id: 5
      name: ASSURANCE_AND_VERIFICATION
      purpose: Distinguish generated, executed and verified results; reconcile evidence, freshness, conflicts, specialist returns, tests and unresolved gaps.
    - id: 6
      name: OUTPUT_AND_PERSISTENCE
      purpose: Produce the selected output profile and persist only through authorized durable-write receipts.
  cross_cutting:
    mission_control: Human command, approval, pause/resume/abort, priority, scope and exception requests.
    control_plane: Authoritative governance, permissions, routing, state, leases, approvals and persistence authorization.
    observability: Read-oriented events, measurements, evidence health, collection state and execution state.
    dashboard: Read-only human projection; any state-changing dashboard action becomes a Mission Control command.
  stages:
    - REQUEST_TRIAGE
    - INTENT_AND_TARGET_INTERPRETATION
    - COLLECTION_NEED_GATE
    - CONDITIONAL_DOMAIN_CONTEXT
    - COLLECTION_MISSION_PREPARATION
    - PLANNING
    - CAPABILITY_AUDIT
    - ROUTING_PREVIEW
    - ROUTING
    - APPROVAL_GATING
    - EVIDENCE_ACQUISITION
    - EXECUTION
    - ASSURANCE_AND_VERIFICATION
    - PERSISTENCE
    - DELIVERY
  compatibility: Runtime traces may retain REQUEST_TRIAGE and INTELLIGENCE request-route labels for host compatibility; collection_mode is authoritative for ARGUS activation.
  optimization: Prefer the minimum sufficient path. Ordinary tasks and policy/rule analysis do not incur ARGUS cost unless structured collection is materially required.
  semantic_normalization: spec/semantic-normalization.yaml governs context-preserving rewrite, multi-axial semantic framing, classification context, standards and international best-practice lenses before specialist execution.
  collection_gate: The canonical ARGUS capability is intelligence_collection. ARGUS_COLLECTION and HYBRID are the only collection modes that may propose ARGUS routing.
  taxonomy_gate: Classification is multi-axial and conditional. Domain, buyer/end-user sector, supply-side sector, industry, product/service, platform/system, procurement category, customs code and capability are distinct concepts.
  capability_gate: Availability is not admission. Providers must satisfy capability-admission, permission, provenance, dependency, conflict and fallback controls before routing.
  routing_preview_gate: Provider invocation requires the digest-bound preview and applicable approval state; changed proposals require a new preview.
  visibility: One ATLAS plan and execution spine governs all visible state. ARGUS does not create a competing spine.
  resume: Reconcile persisted state against actual external state before continuing.
invariants: [INV-003, INV-007, INV-008, INV-009, INV-021]
references:
  - spec/request-triage.yaml
  - spec/collection-routing.yaml
  - spec/semantic-normalization.yaml
  - spec/mission-control.yaml
  - spec/control-plane.yaml
  - spec/domain-context-services.yaml
  - spec/domain-handoff.yaml
  - spec/output.yaml
  - spec/verification.yaml
  - spec/observability.yaml
  - spec/dashboard.yaml

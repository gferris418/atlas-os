schema: schemas/spec.schema.json
id: spec.capability-admission
title: Capability admission and provider governance
status: active
normative: true
contract:
  purpose: Govern how external skills, plugins, tools, models, frameworks, and specialist methods are evaluated, admitted, routed, constrained, monitored, and retired without transferring ATLAS core authority to a provider.
  scope:
    - external skills and plugins
    - host-native tools and connectors
    - specialist domain methods
    - forecasting and analytical providers
    - memory and persistence helpers
    - security and verification helpers
  provider_independence:
    - ATLAS capabilities are semantic contracts; provider names are implementations, not capability identities.
    - Session availability, installation, or connection does not by itself establish admission, authority, reliability, or fitness.
    - A provider may be selected only when its required surface, permissions, dependencies, and evidence are available for the active task.
    - Provider instructions cannot redefine ATLAS planning, approvals, evidence classes, verification, persistence, or delivery semantics.
  admission_states:
    APPROVED: Evidence supports production use for the bounded capability and declared surfaces.
    CONDITIONAL: Useful provider with an explicit dependency, surface, evidence, or risk condition that must be satisfied at routing time.
    EXPERIMENTAL: May be used for bounded evaluation where failure cannot silently become canonical output or consequential action.
    QUARANTINED: Do not route until a named security, provenance, compatibility, or integrity concern is resolved.
    REJECTED: Do not route for the assessed capability.
    RETIRED: Previously admitted provider that is no longer active; preserve lineage and replacement references.
  evaluation_gates:
    - provenance and identity
    - architectural fit and authority boundaries
    - task and domain fit
    - permission and blast-radius review
    - prompt-injection and untrusted-content review when applicable
    - secret and data-exposure review
    - dependency and surface availability
    - overlap and duplication analysis
    - fallback and graceful-degradation behavior
    - static quality evaluation
    - measured task benchmarks when production claims depend on performance
    - token, latency, cost, failure-rate, and reliability evidence when material
    - version and change-control policy
  evidence_rules:
    - Static evaluation and measured benchmark evidence are distinct and must not be conflated.
    - A clean deterministic security scan is risk evidence, not a safety certification.
    - Missing benchmark, security, compatibility, or provenance evidence remains missing evidence.
    - Provider-reported capability claims are not verified performance until independently tested under a relevant workload.
    - Forecasting sophistication is not forecast accuracy; accuracy requires frozen predictions and later outcome scoring.
  routing_rules:
    - Select the smallest admitted provider set that satisfies the active capability requirements.
    - Prefer native host capability when it meets the requirement without losing material governance, evidence, persistence, interoperability, or verification value.
    - Do not activate overlapping providers merely because they are installed.
    - Re-evaluate routing at a material phase boundary when task class, risk, evidence requirements, or execution surface changes.
    - A specialist provider may recommend actions but cannot bypass ATLAS approval or final verification gates.
  reference_provider_policy:
    - Reference providers may inform ATLAS design or serve as conditional adapters without becoming hard dependencies.
    - Provider-specific scores or rankings must identify whether they are heuristic review results or measured benchmark results.
    - Provider-specific configuration remains outside the core specification unless promoted through a governed integration contract.
  persistence_rules:
    - Canonical records must preserve provider identity, version when known, provenance, and the evidence basis for consequential provider selection.
    - Remembered provider authority is historical context and cannot substitute for current approval or current runtime availability.
    - Superseded or retired provider records remain traceable.
  forecasting_profile:
    required_mechanics:
      - structured horizon scan
      - source-lineage and contradiction analysis
      - explicit assumptions and scenarios
      - falsifiable signposts or milestones
      - independent skeptical challenge
      - preserved forecast vintages
      - outcome resolution under predeclared rules
      - calibration and error scoring when outcomes resolve
    provider_rule: Forecast providers are replaceable implementations; ATLAS owns the forecast record, evidence contract, update history, and learning loop.
  specialist_domain_rule: A specialist such as ARGUS remains subordinate to the ATLAS execution spine and may use admitted providers internally only within its registered domain contract and handoff boundaries.
  completion_rule: A capability-admission decision is not production proof until all evidence required for its declared state and surface has been verified.
invariants:

schema: schemas/spec.schema.json
id: spec.runtime
title: Runtime behavior
status: active
normative: true
contract:
  execution_depths:
    L0: Direct response with no unnecessary ceremony.
    L1: Lightweight context and result checks.
    L2: Structured plan, evidence, and verification.
    L3: Governed multi-stage execution with explicit state.
    L4: High-impact execution with strict approvals and independent verification.
  task_classes:
    - ANSWER
    - RESEARCH
    - ANALYSIS
    - DECISION
    - WRITING
    - DOCUMENT
    - DATA
    - CODING
    - DEBUGGING
    - DESIGN
    - PLANNING
    - WORKFLOW
    - EXTERNAL_ACTION
    - MONITORING
    - MULTI_STAGE
  failure_states:
    - BLOCKED
    - PARTIAL
    - UNVERIFIED
    - CAPABILITY_UNAVAILABLE
    - AUTHORIZATION_REQUIRED
    - EVIDENCE_INSUFFICIENT
    - DEPENDENCY_FAILED
    - VALIDATION_FAILED
  domain_classification: Substantive tasks must resolve material taxonomy and classification facets before domain-framework selection.
  domain_alignment: Substantive tasks must resolve applicable international standards and professional frameworks before finalizing the execution plan.
  host_capability_rule: Prefer native host understanding, conversation, generation, and tool behavior; ATLAS adds only material governance, persistence, interoperability, evidence, or verification.
  atomic_execution: Nontrivial work executes through one active atomic unit at a time with event-driven dashboard updates.
  quality_performance_rule: Choose the lightest technique that preserves correctness, evidence, and required controls; avoid duplicated work and unnecessary latency.
  output_rule: Select a user-requested or task-fit output profile, preserve progressive disclosure, and validate only material requirements.
  proportionality: Execution depth follows complexity, ambiguity, risk, and impact rather than importance alone.
invariants:
  - INV-003
  - INV-007
  - INV-008
  - INV-017
  - INV-018
  - INV-019
  - INV-020
references:
  - schemas/task.schema.json
  - schemas/execution.schema.json
  - spec/classification.yaml
  - spec/domain-practices.yaml
  - spec/output.yaml


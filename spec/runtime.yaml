schema: schemas/spec.schema.json
id: spec.runtime
title: Runtime behavior
status: active
normative: true
contract:
  execution_depths:
    L0: Direct response with no unnecessary ceremony.
    L1: Lightweight context and result checks.
    L2: Structured plan, evidence, and verification.
    L3: Governed multi-stage execution with explicit state.
    L4: High-impact execution with strict approvals and independent verification.
  task_classes:
    - ANSWER
    - RESEARCH
    - ANALYSIS
    - DECISION
    - WRITING
    - DOCUMENT
    - DATA
    - CODING
    - DEBUGGING
    - DESIGN
    - PLANNING
    - WORKFLOW
    - EXTERNAL_ACTION
    - MONITORING
    - MULTI_STAGE
  failure_states:
    - BLOCKED
    - PARTIAL
    - UNVERIFIED
    - CAPABILITY_UNAVAILABLE
    - AUTHORIZATION_REQUIRED
    - EVIDENCE_INSUFFICIENT
    - DEPENDENCY_FAILED
    - VALIDATION_FAILED
  domain_classification: Substantive tasks must resolve material taxonomy and classification facets before domain-framework selection.
  intent_profile: After taxonomy routing, classify the normalized objective as opportunity identification, supplier/vendor sourcing, market validation, general research, or a general task. The profile may recommend semantic capability requirements but has no authority to route a provider.
  behavioral_learning: Behavioral preferences are explicit host-managed state, disabled by default, inspectable, reversible, and never inferred from silence. Durable learning requires separate user authorization and a verified persistence receipt.
  domain_alignment: Substantive tasks must resolve applicable international standards and professional frameworks before finalizing the execution plan.
  domain_handoff_rule: When a specialist domain method consumes ATLAS classification/alignment, ATLAS must create a schema-valid immutable handoff snapshot, verify its payload digest before delegation, and verify an exact return receipt before accepting the specialist result.
  host_capability_rule: Prefer native host understanding, conversation, generation, and tool behavior; ATLAS adds only material governance, persistence, interoperability, evidence, or verification.
  atomic_execution: Nontrivial work executes through one active atomic unit at a time with event-driven dashboard updates.
  execution_interface: Hosts should enter the executable reference runtime through execute(ExecutionEnvelope); low-level functions remain compatibility seams and implementation building blocks.
  planning_gate: Every prompt establishes a plan with a concrete identifier before execution; L0 may use one implicit unit, while unresolved material clarification blocks dependent execution.
  surface_adapters: Any AI host with a validated provider-neutral surface identifier uses the shared executable seam for startup, plan gating, dashboard creation, and delivery; known hosts have documented capability mappings, while host deployment and independent conformance evidence remain separate.
  observability: Every dashboard includes timestamp, measured duration, safe input and processing summaries, output summary, goal, task, playbook, frameworks, SOP, selected output profile, plan and clarification state, quality, blockers, and library delivery state.
  persistence_rule: Every delivered output is routed to its profile-defined canonical library collection and correct format when authorized durable storage is available; otherwise expose BLOCKED or CAPABILITY_UNAVAILABLE.
  quality_performance_rule: Choose the lightest technique that preserves correctness, evidence, and required controls; avoid duplicated work and unnecessary latency.
  output_rule: Select a user-requested or task-fit output profile, preserve progressive disclosure, and validate only material requirements.
  proportionality: Execution depth follows complexity, ambiguity, risk, and impact rather than importance alone.
invariants:

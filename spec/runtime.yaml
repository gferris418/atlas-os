schema: schemas/spec.schema.json
id: spec.runtime
title: Runtime behavior
status: active
normative: true
contract:
  execution_depths:
    L0: Direct response with no unnecessary ceremony.
    L1: Lightweight context and result checks.
    L2: Structured plan, evidence, and verification.
    L3: Governed multi-stage execution with explicit state.
    L4: High-impact execution with strict approvals and independent verification.
  task_classes:
    - ANSWER
    - RESEARCH
    - ANALYSIS
    - DECISION
    - WRITING
    - DOCUMENT
    - DATA
    - CODING
    - DEBUGGING
    - DESIGN
    - PLANNING
    - WORKFLOW
    - EXTERNAL_ACTION
    - MONITORING
    - MULTI_STAGE
  lifecycle_states: [CREATED, NORMALIZING, FRAMING, ROUTING, AWAITING_APPROVAL, COLLECTING, ANALYZING, VERIFYING, PERSISTING, COMPLETED, PAUSED, BLOCKED, ABORTED]
  failure_states:
    - BLOCKED
    - PARTIAL
    - UNVERIFIED
    - CAPABILITY_UNAVAILABLE
    - AUTHORIZATION_REQUIRED
    - EVIDENCE_INSUFFICIENT
    - DEPENDENCY_FAILED
    - VALIDATION_FAILED
  bootstrap_rule: Every substantive host invocation initializes Mission Control, Control Plane task state, observability and a compact Dashboard before substantive execution. Bootstrap is governance around the execution spine, not a fourth preprocessing step.
  preprocessing_rule: The only three preprocessing steps are UNDERSTAND_AND_NORMALIZE, MINIMAL_DOMAIN_FRAMING and ROUTE.
  whole_context_rule: ATLAS reads the complete available context as one semantic unit before decomposition, classification, framework mapping, planning or specialist handoff.
  semantic_normalization: Preserve the original context and relationships, normalize the whole meaning without semantic drift, then decompose only as required and reconcile derived facets back to the whole.
  original_input_rule: Store or retain the original input separately from normalized intent so normalization never overwrites the source meaning.
  domain_classification: Resolve high-confidence material taxonomy and classification facets proportionally. Unknown downstream facts or exact codes remain unresolved and do not block an otherwise clear ARGUS-bound semantic handoff.
  intent_profile: After whole-context interpretation and proportional taxonomy routing, classify the normalized objective as opportunity identification, supplier/vendor sourcing, market validation, general research, or a general task. The profile may recommend semantic capability requirements but has no authority to route a provider.
  behavioral_learning: Behavioral preferences are explicit host-managed state, disabled by default, inspectable, reversible, and never inferred from silence. Durable learning requires separate user authorization and a verified persistence receipt.
  domain_alignment: Attach relevant standards, professional-framework families and international best-practice lenses proportionally. Exact applicability may remain unresolved for downstream work and is not a normal pre-ARGUS blocker.
  domain_handoff_rule: When a specialist domain method consumes ATLAS context, ATLAS must create a schema-valid immutable handoff containing the whole normalized semantic context first, then classification/alignment snapshots and unresolved downstream context; verify its payload digest before delegation and verify an exact return receipt before accepting the specialist result.
  semantic_handoff_gate: Meaning ambiguity may block specialist activation. Lifecycle, procurement, budget, quantity, technical specification, exact classification codes, exact standards applicability, funding, supplier/OEM and delivery timing do not block when the whole meaning is clear.
  argus_authorization_rule: collection_mode identifies ARGUS need only. ARGUS_COLLECTION and HYBRID require explicit user authorization before handoff or activation. Missing, rejected, stale or mismatched authorization fails closed.
  host_capability_rule: Prefer native host understanding, conversation, generation and tool behavior; ATLAS requests semantic capabilities while host adapters resolve concrete tools/providers subject to ATLAS admission and policy controls.
  host_portability_rule: ChatGPT, Hermes, Claude, Codex and other compatible AI systems are execution hosts. They may differ in UI and capability inventory but must not redefine ATLAS routing, approval, evidence, lifecycle or persistence semantics.
  atomic_execution: Nontrivial work executes through one active atomic unit at a time with event-driven dashboard updates.
  execution_interface: Hosts should enter the executable reference runtime through the package-level execute(ExecutionEnvelope) portable orchestration seam; lower-level engine/routing functions remain compatibility and implementation seams.
  planning_gate: Every substantive prompt establishes a plan with a concrete identifier before governed provider activation; L0 may use one implicit unit. Only explicit material clarification or another control-plane gate blocks dependent execution; downstream research unknowns remain visible but non-blocking.
  surface_adapters: Any AI host with a validated provider-neutral surface identifier uses the shared orchestration seam for startup, plan gating, Dashboard creation, explicit ARGUS authorization and delivery.
  observability: Every dashboard includes timestamp, measured duration, safe input and processing summaries, output summary, goal, task, playbook, frameworks, SOP, selected output profile, plan and clarification state, quality, blockers/approvals and library delivery state.
  persistence_rule: Every delivered output is routed to its profile-defined canonical library collection and correct format when authorized durable storage is available; otherwise expose BLOCKED or CAPABILITY_UNAVAILABLE.
  quality_performance_rule: Choose the lightest technique that preserves whole-context meaning, correctness, evidence and required controls; avoid duplicated work, unnecessary clarification and unnecessary latency.
  output_rule: Select a user-requested or task-fit output profile, preserve progressive disclosure, and validate only material requirements.
  proportionality: Execution depth follows complexity, ambiguity, risk, and impact rather than importance alone.
invariants:

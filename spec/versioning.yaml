schema: schemas/spec.schema.json
id: spec.versioning
title: Version authority and release lifecycle
status: active
normative: true
contract:
  scheme: Semantic Versioning 2.0.0 with release-candidate prereleases.
  lifecycle:
    - DRAFT
    - CANDIDATE
    - VERIFIED
    - RELEASED
    - SUPERSEDED
    - ARCHIVED
  authority: atlas-os.yaml#/product/version
  component_rule: Component revisions express compatibility and lineage but never compete with product authority.
  release_gate: RELEASED requires all release-blocking controls to be closed with evidence.
  history: Released history is preserved rather than overwritten.
invariants:
  - INV-010
  - INV-014
  - INV-016
references:
  - atlas-os.yaml
  - registries/controls.yaml
  - registries/migrations.yaml


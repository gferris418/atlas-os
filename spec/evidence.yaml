id: atlas.evidence
version: 3.0.0
status: active
normative: true
contract:
  statuses: [CONFIRMED, PROBABLE, POSSIBLE, DISPUTED, UNVERIFIED, STALE]
  principles:
    - A source is distinct from a claim.
    - Observation is distinct from inference.
    - A citation or URL is provenance, not proof by itself.
    - Multiple sources are not automatically independent corroboration.
    - Uncertainty must remain visible.
  provider_role: Providers may collect and propose evidence state; ATLAS owns final evidence acceptance.

schema: schemas/spec.schema.json
id: spec.execution-governance
title: Execution governance
status: active
normative: true
contract:
  purpose: Provide the non-optional control-plane service that governs authority, approvals, side effects, idempotency, retries, compensation, auditability, failure recovery and kill controls for ATLAS execution.
  distinction:
    mission_control: Decides what should happen and may pause, resume, reprioritize or abort.
    control_plane: Decides whether a requested operation is permitted under current policy, authority, risk and approval state.
    workflow_engine: Executes approved steps reliably with checkpoints, retries and resumability.
    capability: Provides bounded domain reasoning or collection but cannot grant itself authority.
  authority_record:
    required_fields: [actor, action, target, permission, side_effect_class, approval_required, approval_scope, approval_expiry, idempotency_key, retry_policy, compensation_strategy, preconditions, postconditions, audit_receipt, failure_state, resume_state, escalation, kill_switch]
  side_effect_classes:
    NONE: Read-only or purely analytical work with no external mutation.
    REVERSIBLE: Mutation with a reliable bounded reversal path.
    MATERIAL: Mutation with meaningful operational, financial, legal or persistence consequences.
    HIGH_IMPACT: Consequential external action requiring explicit scoped approval and enhanced verification.
  reliability_rules:
    - Approved external actions require idempotency or an equivalent replay guard when technically possible.
    - Retries cannot broaden permissions or bypass approval expiry.
    - Compensation is explicit for reversible multi-step workflows when partial failure could leave inconsistent state.
    - Failure state and resume state remain distinct from completion state.
    - A resumed workflow revalidates permissions, approvals, dependencies and current provider state when material context may have changed.
    - A kill switch must stop new dependent execution without rewriting historical receipts.
  audit_rules:
    - Every material state transition preserves actor, authority basis, timestamp, target and outcome.
    - Provider recommendations do not count as execution authority.
    - Dashboard controls submit commands through Mission Control and Control Plane; they do not mutate provider state directly.
  completion_rule: No capability may report a consequential action as executed until the execution receipt and required postconditions are verified.
invariants: [INV-007, INV-008, INV-009, INV-011, INV-012, INV-020, INV-021]
references:
  - spec/mission-control.yaml
  - spec/control-plane.yaml
  - spec/approvals.yaml
  - spec/runtime.yaml
  - spec/capability-layer.yaml

id: atlas.core
version: 3.0.0
status: active
normative: true
contract:
  purpose: Portable AI operating framework that governs work from user intent to verified delivery.
  authority_chain: [USER, MISSION_CONTROL, CONTROL_PLANE, CAPABILITY_PROVIDER]
  pre_execution_flow: [UNDERSTAND_AND_NORMALIZE, MINIMAL_DOMAIN_FRAMING, ROUTE]
  invariants:
    - Preserve original intent, constraints, relationships, and critical literals.
    - Do not add a fourth preprocessing step.
    - ATLAS owns routing before and after every provider handoff.
    - Providers execute bounded capabilities; they do not own orchestration.
    - Consequential actions require explicit scoped approval.
    - Verification precedes completion claims.
  lifecycle: [CREATED, NORMALIZING, FRAMING, ROUTING, AWAITING_APPROVAL, EXECUTING, VERIFYING, PERSISTING, COMPLETED, PAUSED, BLOCKED, ABORTED]
references:
  - spec/mission-control.yaml
  - spec/control-plane.yaml
  - spec/routing.yaml
  - spec/execution.yaml

schema: schemas/spec.schema.json
id: spec.domain-handoff
title: Governed domain-context handoff
status: active
normative: true
contract:
  purpose: Transfer ATLAS-owned domain classification and framework alignment to a specialist domain method without semantic drift, loss, or silent reclassification.
  placement: The handoff is an interoperability seam inside ROUTING/EXECUTION; it does not add a new execution-spine stage.
  producer: ATLAS OS
  consumer: Any authorized specialist domain method.
  input_authority:
    domain_classification: ATLAS DOMAIN_CLASSIFICATION
    domain_alignment: ATLAS DOMAIN_FRAMEWORK_ALIGNMENT
  rules:
    - A substantive specialist-domain execution must receive a schema-valid domain-context handoff before consuming ATLAS domain context.
    - The handoff must copy the current task domain_classification and domain_alignment snapshots exactly.
    - The producer must include source_task_id, handoff_id, contract_version, consumer, created_at, unresolved_material, risk_flags, and payload_sha256.
    - The payload SHA-256 covers the canonical handoff object excluding payload_sha256 and detects mutation after production.
    - The consumer may enrich the context for specialist analysis but must not silently redefine ATLAS taxonomy, classification, standards, framework applicability, risk flags, or unresolved facets.
    - PARTIAL context may be consumed only with unresolved facets preserved explicitly; BLOCKED context cannot authorize dependent specialist execution.
    - The consumer must return a schema-valid receipt containing the exact handoff_id, contract_version, payload_sha256, and consumer identity.
    - ATLAS must reject a returned specialist result when its receipt is missing, rejected, stale, mutated, or mismatched to the originating handoff.
    - A new materially different domain-classification/alignment snapshot requires a new handoff_id and payload_sha256; old receipts must not be reused.
  handoff_states:
    READY: Domain classification is CLASSIFIED and alignment is ALIGNED or NOT_APPLICABLE.
    PARTIAL: Domain context is usable but material unresolved classification remains; the consumer must preserve those unresolved facets.
    BLOCKED: Domain classification or framework alignment requires material research before dependent specialist execution.
  integrity:
    algorithm: SHA-256
    canonicalization: UTF-8 JSON with sorted keys and compact separators, excluding payload_sha256.
  schemas:
    context: schemas/domain-context-handoff.schema.json
    receipt: schemas/domain-handoff-receipt.schema.json
invariants:
  - INV-006
  - INV-016
  - INV-018
  - INV-019
  - INV-021
references:
  - spec/classification.yaml
  - spec/domain-practices.yaml
  - spec/execution-spine.yaml
  - spec/runtime.yaml
  - schemas/task.schema.json

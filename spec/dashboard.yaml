schema: schemas/spec.schema.json
id: spec.dashboard
title: User-facing execution dashboard
status: active
normative: true
contract:
  minimum_fields:
    - system
    - progress
    - active_stage
    - active_unit
    - completed_units
    - total_units
    - blocker_or_approval
    - library
    - quality_gate
  expanded_fields:
    - objective
    - execution_layer
    - evidence_health
    - highest_risk
    - pending_decision
    - outputs
    - next_milestone
    - next_action
  trigger: Initialize a compact dashboard for every prompt, including L0 direct tasks.
  visual_rule: Use a lightweight text progress bar and concise state labels; do not require images, animation, or expensive rendering.
  realtime_rule: Update at meaningful events such as work-unit start, completion, blocker, approval, verification, and delivery; do not poll or emit token-by-token status.
  update_rule: Keep updates short and emit only when operational state materially changes.
  performance: Dashboard generation must remain deterministic, local, and constant-cost relative to task size.
  privacy: Expose useful state but never private chain-of-thought or hidden reasoning tokens.
invariants:
  - INV-003
  - INV-004
  - INV-017
  - INV-020
references:
  - schemas/dashboard.schema.json

id: atlas.approvals
version: 3.0.0
status: active
normative: true
contract:
  statuses: [NOT_REQUIRED, PENDING, APPROVED, REJECTED, STALE]
  required_for:
    - ARGUS_ACTIVATION
    - EXTERNAL_WRITE
    - PUBLICATION
    - PURCHASE
    - PERMISSION_CHANGE
    - CREDENTIAL_OPERATION
    - DESTRUCTIVE_ACTION
  properties:
    explicit: true
    scoped: true
    reusable_by_default: false
    material_change_invalidates: true
  rule: Routing need and authorization are separate states; selecting ARGUS never implies permission to activate ARGUS.

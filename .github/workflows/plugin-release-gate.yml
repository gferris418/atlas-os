name: ChatGPT Plugin Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_required: ${{ steps.gate.outputs.release_required }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Audit dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
      - name: Determine changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            BASE="$(git rev-parse HEAD^)"
            HEAD="$(git rev-parse HEAD)"
          fi
          git diff --name-only "$BASE" "$HEAD" > changed-paths.txt
          echo "Changed paths:"
          cat changed-paths.txt
      - name: Resolve pinned ARGUS revision
        id: argus_pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          policy = yaml.safe_load(Path('.github/plugin-release-policy.yaml').read_text(encoding='utf-8'))
          argus = policy['argus_compatibility']
          if argus['repository'] != 'gferris418/argus-intelligence':
              raise SystemExit('unexpected ARGUS repository in plugin release policy')
          commit = argus['compatible_commit']
          if not isinstance(commit, str) or len(commit) != 40:
              raise SystemExit('plugin release policy must pin a 40-character ARGUS commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"commit={commit}\n")
          PY
      - name: Checkout pinned ARGUS contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: gferris418/argus-intelligence
          ref: ${{ steps.argus_pin.outputs.commit }}
          path: .argus-contract
          fetch-depth: 1
          persist-credentials: false
      - name: Validate pinned ARGUS contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.plugin_release_gate import load_policy, validate_argus_checkout

          policy = load_policy(Path('.github/plugin-release-policy.yaml'))
          result = validate_argus_checkout(Path('.argus-contract'), policy, atlas_root=Path('.'))
          print(f"Validated ARGUS {result['commit']} contract {result['contract_version']} against ATLAS {result['atlas_version']}")
          PY
      - name: Validate release revision
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q atlas_runtime
          python -m atlas_runtime --help
          python -m unittest discover -s tests/unit -v
          python -m unittest discover -s tests/conformance -v
          python -m unittest discover -s tests/integration -v
          python tools/validate.py .
      - name: Classify plugin impact and prepare release bundle
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/plugin_release_gate.py \
            --changed-path-file changed-paths.txt \
            --atlas-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --argus-root .argus-contract \
            --metadata-output plugin-release-metadata.json \
            --bundle-dir dist/plugin-release \
            | tee plugin-release-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("plugin-release-metadata.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"release_required={str(payload['release_required']).lower()}\n")
              handle.write(f"review_required={str(payload['review_required']).lower()}\n")
          PY
      - name: Build synchronization request
        if: steps.gate.outputs.release_required == 'true'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import yaml

          policy = yaml.safe_load(Path('.github/plugin-release-policy.yaml').read_text(encoding='utf-8'))
          sync = policy['synchronization']
          manifest = json.loads(Path(policy['plugin']['manifest']).read_text(encoding='utf-8'))
          metadata = json.loads(Path('plugin-release-metadata.json').read_text(encoding='utf-8'))
          wrapper_hashes = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in sync['wrapper_paths']
          }
          request = {
              'schema_version': '1.0.0',
              'event_type': sync['event_type'],
              'plugin': {
                  'name': policy['plugin']['name'],
                  'version': manifest['version'],
              },
              'source': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'commit': os.environ['SOURCE_COMMIT'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
              },
              'artifact': {
                  'name': policy['bundle']['artifact_name'],
                  'archive': 'atlas-os-chatgpt-plugin.zip',
                  'release_metadata': policy['bundle']['metadata_file'],
              },
              'wrapper': {
                  'hash_algorithm': sync['hash_algorithm'],
                  'sha256': wrapper_hashes,
              },
              'compatibility': {
                  'argus_commit': metadata['source']['argus_compatible_commit'],
                  'argus_contract_version': metadata['source']['argus_contract_version'],
                  'argus_contract_validated': metadata['source']['argus_contract_validated'],
              },
              'publication': {
                  'automatic': bool(policy['publication']['automatic']),
                  'mechanism': policy['publication']['mechanism'],
                  'require_current_release_id': bool(policy['publication']['require_current_release_id']),
                  'artifact_only_publication_input': bool(sync['artifact_only_publication_input']),
                  'publication_receipt_required': bool(sync['publication_receipt_required']),
              },
          }
          out = Path('dist/plugin-release') / sync['request_file']
          out.write_text(json.dumps(request, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(request, sort_keys=True))
          PY
      - name: Publish gate summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path("plugin-release-metadata.json").read_text())
          print("## ChatGPT plugin release gate")
          print(f"- Release required: `{p['release_required']}`")
          print(f"- Review required: `{p['review_required']}`")
          print(f"- ATLAS commit: `{p['source']['atlas_commit']}`")
          print(f"- ARGUS compatible commit: `{p['source']['argus_compatible_commit']}`")
          print(f"- ARGUS contract version: `{p['source']['argus_contract_version']}`")
          print(f"- ARGUS contract independently validated: `{p['source']['argus_contract_validated']}`")
          if p['impact']['release_matches']:
              print("- Release-driving paths: " + ", ".join(f"`{x}`" for x in p['impact']['release_matches']))
          if p['impact']['review_matches']:
              print("- Review-only paths: " + ", ".join(f"`{x}`" for x in p['impact']['review_matches']))
          PY
      - name: Upload guarded plugin release bundle
        if: steps.gate.outputs.release_required == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: atlas-os-chatgpt-plugin-release
          path: |
            dist/plugin-release/atlas-os-chatgpt-plugin.zip
            dist/plugin-release/plugin-release-metadata.json
            dist/plugin-release/plugin-sync-request.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  plugin-sync-handoff:
    needs: plugin-release-gate
    if: github.event_name == 'push' && needs.plugin-release-gate.outputs.release_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Emit repository synchronization event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' > sync-dispatch.json
          import json
          import os
          payload = {
              'event_type': 'chatgpt_plugin_sync_required',
              'client_payload': {
                  'plugin': 'atlas-os',
                  'source_commit': os.environ['SOURCE_COMMIT'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'artifact_name': 'atlas-os-chatgpt-plugin-release',
                  'sync_request': 'plugin-sync-request.json',
              },
          }
          print(json.dumps(payload))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input sync-dispatch.json

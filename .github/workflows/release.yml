name: Package and publish ATLAS-OS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements.lock
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/conformance -v
      - run: python -m unittest discover -s tests/regression -v
      - run: python -m unittest discover -s tests/integration -v
      - run: python tools/validate/validate_repository.py .
      - run: python tools/package/build_release.py . dist --tag "${GITHUB_REF_NAME}"
      - name: Create GitHub release and attach deterministic artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes "${args[@]}"


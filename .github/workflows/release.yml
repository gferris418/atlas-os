name: Package and publish ATLAS-OS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/conformance -v
      - run: python -m unittest discover -s tests/regression -v
      - run: python -m unittest discover -s tests/integration -v
      - run: python tools/validate/validate_repository.py .
      - run: python tools/package/build_release.py . dist
      - name: Create GitHub release and attach deterministic artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes "${args[@]}"


name: Validate ATLAS-OS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/conformance -v
      - run: python -m unittest discover -s tests/regression -v
      - run: python tools/validate/validate_repository.py .


name: Validate ATLAS-OS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements.lock
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/conformance -v
      - run: python -m unittest discover -s tests/regression -v
      - run: python -m unittest discover -s tests/integration -v
      - run: python tools/validate/validate_repository.py .
      - name: Build deterministic main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/package/build_release.py . dist
      - name: Upload deterministic main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-os-main-snapshot
          path: |
            dist/atlas-os-*.zip
            dist/atlas-os-*.tar.gz
            dist/atlas-os-*.manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


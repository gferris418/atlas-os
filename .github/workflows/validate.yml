name: Validate ATLAS-OS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes --requirement requirements.lock
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/conformance -v
      - run: python -m unittest discover -s tests/regression -v
      - run: python -m unittest discover -s tests/integration -v
      - run: python tools/validate/validate_repository.py .
      - name: Build deterministic main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/package/build_release.py . dist
      - name: Upload deterministic main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: atlas-os-main-snapshot
          path: |
            dist/atlas-os-*.zip
            dist/atlas-os-*.tar.gz
            dist/atlas-os-*.manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


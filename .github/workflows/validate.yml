name: Validate ATLAS-OS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
      - name: Compile runtime
        run: python -m compileall -q atlas_runtime
      - name: Smoke-test CLI
        run: python -m atlas_runtime --help
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Conformance tests
        run: python -m unittest discover -s tests/conformance -v
      - name: Integration tests
        run: python -m unittest discover -s tests/integration -v
      - name: Repository contract
        run: python tools/validate.py .

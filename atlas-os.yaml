schema: schemas/atlas-os.schema.json
product:
  id: atlas-os
  name: ATLAS OS
  version: 2.0.2-rc.4
  release_channel: candidate
  schema_version: 2
  status: CANDIDATE
  classification: internal
  license: MIT
authority:
  manifest: atlas-os.yaml
  ai_manifest: atlas-ai.yaml
  governance: governance.yaml
  core_spec: spec/core.yaml
  version_pointer: atlas-os.yaml#/product/version
architecture:
  mission_control: spec/mission-control.yaml
  control_plane: spec/control-plane.yaml
  collection_routing: spec/collection-routing.yaml
  domain_context_services: spec/domain-context-services.yaml
  domain_intelligence: spec/domain-intelligence.yaml
  observability: spec/observability.yaml
  dashboard: spec/dashboard.yaml
execution:
  request_triage: spec/request-triage.yaml
  spine: spec/execution-spine.yaml
  runtime: spec/runtime.yaml
  classification: spec/classification.yaml
  domain_practices: spec/domain-practices.yaml
  domain_handoff: spec/domain-handoff.yaml
  collection_mission: schemas/collection-mission.schema.json
  output: spec/output.yaml
  default_depth: L1
  control_revision: atlas-bootstrap-2026-10-22-r8
release:
  target_version: 2.0.2
  blocking_controls: [MIG-029, MIG-037]
  package_command: python tools/package/build_release.py . dist
  validation_command: python tools/validate/validate_repository.py . && python tools/validate/validate_machine_contracts.py . && python tools/validate/validate_output_contracts.py .
artifacts:
  ai_entrypoint: atlas-ai.yaml
  governance: governance.yaml
  specifications: spec
  schemas: schemas
  registries: registries
  integrations: integrations
  migrations: migration
  tests: tests
  library: library
  release_verification_schema: schemas/release-verification.schema.json

schema_version: 3
product:
  id: atlas-os
  name: ATLAS OS
  version: 3.0.3
  release_channel: stable
  status: RELEASED
  license: MIT
authority:
  ai_manifest: atlas-ai.yaml
  governance: governance.yaml
  mission_control: spec/mission-control.yaml
  core: spec/core.yaml
  routing: spec/routing.yaml
specifications:
  - spec/core.yaml
  - spec/mission-control.yaml
  - spec/control-plane.yaml
  - spec/context.yaml
  - spec/routing.yaml
  - spec/execution.yaml
  - spec/evidence.yaml
  - spec/quality-governance.yaml
  - spec/approvals.yaml
  - spec/verification.yaml
  - spec/persistence.yaml
  - spec/chat-event-persistence.yaml
  - spec/observability.yaml
  - spec/performance-telemetry.yaml
registries:
  - registries/capabilities.yaml
  - registries/providers.yaml
  - registries/surfaces.yaml
  - registries/classification
integrations:
  - integrations/argus.yaml
  - integrations/chatgpt.yaml
  - integrations/chatgpt-bootstrap.yaml
  - integrations/hermes-agent.yaml
  - integrations/generic-host.yaml
  - integrations/access-asia.yaml
plugin:
  manifest: plugin.json
  skills_root: skills
  primary_skill: skills/atlas-os/SKILL.md
runtime:
  package: atlas_runtime
  command: python -m atlas_runtime
  validation: python tools/validate.py .
documentation:
  root: docs/README.md
  navigation: docs/SUMMARY.md
release:
  history_system: git_and_github_releases
  active_migration_diaries: false
  compatibility_aliases: false
